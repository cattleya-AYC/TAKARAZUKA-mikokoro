<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申込者一覧(管理者用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="list-icon.png">
<link rel="apple-touch-icon" href="list-icon.png">
<style>
  :root{
    --navy-deep:#efeaf2; --navy-card:#fffdf9; --navy-card-2:#f4eef7; --gold:#9a86c9;
    --gold-soft:#6d5aa3; --cream:#332c47; --rose:#a5544a; --line:rgba(154,134,201,0.35);
    --muted:#8b84a0; --ok:#4f8f66;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.7) 0%, transparent 65%),
      var(--navy-deep);
    color:var(--cream);
    font-family:'Noto Sans JP', sans-serif; padding:0 0 60px;
  }
  .hero{ text-align:center; padding:30px 20px 14px; }
  .eyebrow{ font-family:'Shippori Mincho', serif; font-size:14px; letter-spacing:.16em; color:var(--gold-soft); font-weight:700; }
  h1{ font-family:'Shippori Mincho', serif; font-size:20px; margin:8px 0 0; letter-spacing:.03em; }
  .sub{ font-size:12.5px; color:var(--muted); margin-top:6px; }
  .divider{
    display:flex; align-items:center; justify-content:center; gap:10px;
    max-width:160px; margin:10px auto 0; opacity:.85;
  }
  .divider::before, .divider::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .gem{
    width:6px; height:6px; background:var(--gold); transform:rotate(45deg);
    border:1px solid var(--gold-soft); flex-shrink:0;
  }

  .toolbar{ max-width:1000px; margin:14px auto 0; padding:0 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select, input[type=text]{
    background:var(--navy-card); border:1px solid var(--line); color:var(--cream);
    border-radius:8px; padding:9px 12px; font-size:14px; font-family:inherit;
  }
  select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 2px var(--line); }
  .count-badge{
    font-size:12.5px; color:var(--gold-soft); background:var(--navy-card);
    border:1px solid var(--gold); border-radius:20px; padding:5px 14px; font-weight:700;
  }
  .refresh-btn{
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-soft) 100%);
    border:1px solid var(--gold-soft); color:#fffaf3;
    border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; font-weight:700;
  }

  .table-wrap{
    max-width:1000px; margin:16px auto 0; padding:0 16px 16px; overflow-x:auto;
  }
  table{
    border-collapse:separate; border-spacing:0; width:100%; min-width:900px; font-size:13px;
    background:var(--navy-card); border:1px solid var(--gold); border-radius:12px; overflow:hidden;
  }
  th, td{ padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--gold-soft); font-weight:700; background:var(--navy-card-2); position:sticky; top:0; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:rgba(154,134,201,0.05); }
  td.name{ font-weight:700; font-family:'Shippori Mincho', serif; }
  .badge{ padding:3px 10px; border-radius:12px; font-size:11.5px; font-weight:700; display:inline-block; }
  .badge.pending{ background:rgba(154,134,201,0.15); color:var(--gold-soft); }
  .badge.accepted{ background:rgba(79,143,102,0.15); color:var(--ok); }
  .badge.declined{ background:rgba(165,84,74,0.15); color:var(--rose); }
  .badge.cancelled{ background:rgba(139,132,160,0.15); color:var(--muted); }

  .actions{ display:flex; gap:6px; }
  .actions button{
    font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--navy-card-2); color:var(--cream); cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .actions button.accept{ border-color:var(--ok); color:var(--ok); }
  .actions button.decline{ border-color:var(--rose); color:var(--rose); }
  .actions button:disabled{ opacity:.4; cursor:default; }

  .mini-badge{
    display:inline-block; min-width:22px; text-align:center; font-size:12px; font-weight:700;
    padding:3px 8px; border-radius:10px; background:var(--navy-card-2); color:var(--gold-soft);
    border:1px solid var(--line);
  }
  .name-btn{
    background:none; border:none; padding:0; font-family:'Shippori Mincho', serif; font-weight:700;
    font-size:13.5px; color:var(--cream); cursor:pointer; text-decoration:underline; text-decoration-color:var(--line);
    text-underline-offset:3px;
  }
  .detail-row td{ padding:8px 12px; background:var(--navy-card-2); }
  .detail-box{ display:flex; gap:20px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); white-space:normal; }
  .detail-box b{ color:var(--gold-soft); }

  .empty-msg, .status-msg{ text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px; }
  .status-msg.err{ color:var(--rose); }

  .penalty-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700;
    padding:3px 9px; border-radius:12px; background:rgba(165,84,74,0.12); color:var(--rose);
    cursor:pointer; border:none;
  }
  .penalty-badge.zero{ background:var(--navy-card-2); color:var(--muted); }
  .penalty-btn{
    font-size:11.5px; padding:5px 9px; border-radius:6px; border:1px solid var(--line);
    background:var(--navy-card-2); color:var(--cream); cursor:pointer; margin-left:6px; font-family:inherit;
  }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,15,30,0.55);
    z-index:100; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--navy-card); border:1px solid var(--gold); border-radius:16px 16px 0 0;
    max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
    padding:22px 20px 26px; box-shadow:0 -4px 24px rgba(0,0,0,0.2);
  }
  @media (min-width: 560px){
    .modal-overlay{ align-items:center; }
    .modal-box{ border-radius:16px; }
  }
  .modal-box h3{
    font-family:'Shippori Mincho', serif; font-size:17px; margin:0 0 4px; color:var(--gold-soft);
  }
  .modal-box .modal-points{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .modal-box .notes-history{
    background:var(--navy-card-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; font-size:12.5px; line-height:1.8; white-space:pre-wrap;
    max-height:160px; overflow-y:auto; margin-bottom:16px; color:var(--cream);
  }
  .modal-box .notes-history.empty{ color:var(--muted); }
  .modal-box label{ font-size:13px; color:var(--gold-soft); font-weight:700; display:block; margin-bottom:6px; }
  .modal-box textarea{
    width:100%; min-height:90px; background:var(--navy-card-2); border:1px solid var(--line);
    color:var(--cream); border-radius:8px; padding:11px 13px; font-size:14px; font-family:inherit; resize:vertical;
  }
  .modal-box textarea:focus{ outline:none; border-color:var(--gold); }
  .modal-checkbox{ display:flex; align-items:center; gap:8px; margin:12px 0 18px; font-size:13px; }
  .modal-checkbox input{ width:16px; height:16px; accent-color:var(--gold); }
  .modal-btn-row{ display:flex; gap:10px; }
  .modal-btn-row button{
    flex:1; padding:12px; border-radius:8px; font-size:14px; cursor:pointer; font-family:inherit; font-weight:700;
  }
  .modal-btn-row .cancel{ background:var(--navy-card-2); border:1px solid var(--line); color:var(--cream); }
  .modal-btn-row .save{
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-soft) 100%);
    border:1px solid var(--gold-soft); color:#fffaf3;
  }
  .modal-btn-row .save:disabled{ opacity:.5; }

  .summary-bar{
    max-width:1000px; margin:16px auto 0; padding:0 16px;
    display:flex; gap:12px; flex-wrap:wrap;
  }
  .summary-item{
    flex:1; min-width:110px; background:var(--navy-card); border:1px solid var(--gold);
    border-radius:10px; padding:14px 10px; text-align:center;
  }
  .summary-num{
    display:block; font-family:'Shippori Mincho', serif; font-size:24px; color:var(--gold-soft); font-weight:700;
  }
  .summary-label{ display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }

  @media print{
    body{ background:#fff !important; color:#000 !important; padding:0; }
    .toolbar, .refresh-btn, .actions, .penalty-btn, .modal-overlay, #printBtn{ display:none !important; }
    .hero:not(#printTitle){ display:none !important; }
    #printTitle{ display:block !important; padding:10px 0; }
    #printTitle h1{ color:#000; }
    .summary-bar{ margin:0 auto 10px; }
    .summary-item{ border-color:#999; background:#fff; }
    .summary-num, .summary-label{ color:#000 !important; }
    table{ border-color:#999 !important; }
    th{ background:#eee !important; color:#000 !important; }
    td{ color:#000 !important; border-color:#ccc !important; }
    .badge{ border:1px solid #999; }
    .table-wrap{ overflow:visible; }
    table{ min-width:0; font-size:11px; }
  }
</style>
</head>
<body>

<div class="modal-overlay" id="penaltyModal">
  <div class="modal-box">
    <h3 id="modalName"></h3>
    <p class="modal-points" id="modalPoints"></p>

    <label>これまでの記録</label>
    <div class="notes-history" id="modalHistory"></div>

    <label>新しく記録する内容</label>
    <textarea id="modalTextarea" placeholder="例:当日11時にドタキャン連絡あり。理由は体調不良とのこと。過去にも直前キャンセルが1回あり。"></textarea>

    <label class="modal-checkbox">
      <input type="checkbox" id="modalIncrement" checked>
      <span>ペナルティポイントを +1 する</span>
    </label>

    <div class="modal-btn-row">
      <button class="cancel" id="modalCancel">閉じる</button>
      <button class="save" id="modalSave">記録する</button>
    </div>
  </div>
</div>

<div class="hero" id="printTitle" style="display:none;">
  <h1 id="printEventName"></h1>
</div>

<div class="hero">
  <div class="eyebrow">管理者用</div>
  <h1>申込者一覧</h1>
  <div class="divider"><span class="gem"></span></div>
  <p class="sub">開催回を選んで、申込状況を確認・更新できます</p>
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-item"><span class="summary-num" id="sumApplicants">0</span><span class="summary-label">申込者数</span></div>
  <div class="summary-item"><span class="summary-num" id="sumTickets">0</span><span class="summary-label">チケット枚数</span></div>
  <div class="summary-item"><span class="summary-num" id="sumMeals">0</span><span class="summary-label">食事参加者数</span></div>
</div>

<div class="toolbar">
  <select id="eventSelect"><option>読み込み中…</option></select>
  <select id="statusFilter">
    <option value="all">すべて表示</option>
    <option value="審査中">審査中のみ</option>
    <option value="参加決定">参加決定のみ</option>
    <option value="お断り">お断りのみ</option>
  </select>
  <span class="count-badge" id="countBadge"></span>
  <span class="count-badge" id="statusBreakdown"></span>
  <button class="refresh-btn" id="refreshBtn">更新</button>
  <button class="refresh-btn" id="printBtn">🖨 PDF印刷</button>
</div>

<div class="table-wrap">
  <table id="dataTable" style="display:none;">
    <thead>
      <tr>
        <th>操作</th>
        <th>参加回数</th>
        <th>ペナルティ</th>
        <th>氏名</th>
        <th>回生</th>
        <th>同伴者</th>
        <th>枚数</th>
        <th>座席希望</th>
        <th>お食事</th>
        <th>申込日時</th>
        <th>状態</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <p class="empty-msg" id="emptyMsg" style="display:none;">この開催回の申込みはまだありません。</p>
  <p class="status-msg" id="statusMsg"></p>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://uyhqnyrnhdjpgrceitgh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ChLAh-7Y10km0WzbAZfE7A_dnWkJkow";

  function getSb(){
    if(!window.supabase){
      throw new Error('Supabaseライブラリの読み込みに失敗しました。画面を再読み込みしてください。');
    }
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  window.addEventListener('error', (ev)=>{
    const box = document.getElementById('statusMsg');
    box.classList.add('err');
    box.textContent = '予期しないエラー:' + (ev.message || '');
  });
  window.addEventListener('unhandledrejection', (ev)=>{
    const box = document.getElementById('statusMsg');
    box.classList.add('err');
    box.textContent = '予期しないエラー:' + (ev.reason?.message || ev.reason || '');
  });

  const weekdayJp = ['日','月','火','水','木','金','土'];
  function formatDateJp(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}(${weekdayJp[d.getDay()]})`;
  }
  function formatDateTimeJp(isoStr){
    if(!isoStr) return '';
    const d = new Date(isoStr);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  const statusLabel = { '審査中':'審査中', '参加決定':'参加決定', 'お断り':'お断り', 'キャンセル':'キャンセル' };
  const statusClass = { '審査中':'pending', '参加決定':'accepted', 'お断り':'declined', 'キャンセル':'cancelled' };

  let sb = null;
  let events = [];

  async function waitForLib(timeoutMs){
    return new Promise((resolve, reject)=>{
      const start = Date.now();
      const check = ()=>{
        if(window.supabase) resolve();
        else if(Date.now() - start > timeoutMs) reject(new Error('ライブラリの読み込みがタイムアウトしました'));
        else setTimeout(check, 150);
      };
      check();
    });
  }

  async function loadEvents(){
    const { data, error } = await sb
      .from('events')
      .select('id, title, event_number, troupe, event_date')
      .order('event_date', { ascending: false });
    if(error) throw error;
    events = data || [];
    const sel = document.getElementById('eventSelect');
    sel.innerHTML = '';
    if(events.length === 0){
      sel.innerHTML = '<option>開催回が登録されていません</option>';
      return;
    }
    events.forEach(ev=>{
      const opt = document.createElement('option');
      opt.value = ev.id;
      opt.textContent = `第${ev.event_number ?? '?'}回 ${ev.troupe ?? ''}組(${formatDateJp(ev.event_date)})`;
      sel.appendChild(opt);
    });
  }

  let currentRows = [];
  let recentCounts = {};

  async function loadRegistrations(eventId){
    const tbody = document.getElementById('tableBody');
    const table = document.getElementById('dataTable');
    const emptyMsg = document.getElementById('emptyMsg');
    const statusMsg = document.getElementById('statusMsg');
    const countBadge = document.getElementById('countBadge');
    statusMsg.textContent = '';
    statusMsg.classList.remove('err');
    tbody.innerHTML = '';
    table.style.display = 'none';
    emptyMsg.style.display = 'none';

    const { data, error } = await sb
      .from('registrations')
      .select('*, participants(id, name, email, phone, penalty_points, penalty_notes)')
      .eq('event_id', eventId)
      .order('applied_at', { ascending: false });

    if(error) throw error;

    currentRows = data || [];

    if(currentRows.length === 0){
      emptyMsg.style.display = 'block';
      countBadge.textContent = '0件';
      document.getElementById('statusBreakdown').textContent = '';
      recentCounts = {};
      return;
    }

    // 直近7回の参加回数を取得
    recentCounts = {};
    const pids = [...new Set(currentRows.map(r => r.participants?.id).filter(Boolean))];
    if(pids.length > 0){
      const { data: recentData, error: recentErr } = await sb
        .from('v_recent_participation')
        .select('participant_id, recent_count')
        .in('participant_id', pids);
      if(!recentErr && recentData){
        recentData.forEach(row => { recentCounts[row.participant_id] = row.recent_count; });
      }
    }

    renderBreakdown(currentRows);
    renderTable(currentRows);
  }

  function renderBreakdown(rows){
    const counts = { '審査中':0, '参加決定':0, 'お断り':0, 'キャンセル':0 };
    rows.forEach(r => { const s = r.status || '審査中'; counts[s] = (counts[s]||0) + 1; });
    document.getElementById('statusBreakdown').textContent =
      `審査中${counts['審査中']} / 決定${counts['参加決定']} / お断り${counts['お断り']}`;
  }

  function renderSummary(rows){
    const applicants = rows.length;
    const tickets = rows.reduce((sum, r) => sum + (Number(r.answers?.participant_count) || 1), 0);
    const meals = rows.filter(r => r.answers?.meal === 'ご参加').length;
    document.getElementById('sumApplicants').textContent = applicants;
    document.getElementById('sumTickets').textContent = tickets;
    document.getElementById('sumMeals').textContent = meals;
  }

  function renderTable(rows){
    const tbody = document.getElementById('tableBody');
    const table = document.getElementById('dataTable');
    const countBadge = document.getElementById('countBadge');
    const filter = document.getElementById('statusFilter').value;

    const filtered = filter === 'all' ? rows : rows.filter(r => (r.status || '審査中') === filter);

    tbody.innerHTML = '';
    countBadge.textContent = `${filtered.length}件`;
    renderSummary(filtered);

    filtered.forEach(r=>{
      const p = r.participants || {};
      const a = r.answers || {};
      const tr = document.createElement('tr');
      const status = r.status || '審査中';
      const points = p.penalty_points || 0;
      const recentCount = recentCounts[p.id] ?? '-';
      const rowId = r.id;

      tr.innerHTML = `
        <td class="actions">
          <button class="accept" data-id="${r.id}" data-status="参加決定" ${status==='参加決定' ? 'disabled' : ''}>決定</button>
          <button class="decline" data-id="${r.id}" data-status="お断り" ${status==='お断り' ? 'disabled' : ''}>お断り</button>
        </td>
        <td><span class="mini-badge">${recentCount}</span></td>
        <td><button class="penalty-badge ${points > 0 ? '' : 'zero'}" data-pid="${p.id || ''}" data-pname="${escapeHtml(p.name || '')}" data-open-modal="1">⚠ ${points}</button></td>
        <td class="name"><button class="name-btn" data-detail="${rowId}">${escapeHtml(p.name || a.full_name || '')}</button></td>
        <td>${escapeHtml(a.grade || '')}</td>
        <td>${a.participant_count === '2' ? 'あり' : 'なし'}</td>
        <td>${escapeHtml(a.participant_count || '1')}枚</td>
        <td>${escapeHtml(a.seat_pref || '-')}</td>
        <td>${a.meal === 'ご参加' ? '参加' : '不参加'}</td>
        <td>${formatDateTimeJp(r.applied_at)}</td>
        <td><span class="badge ${statusClass[status] || 'pending'}">${statusLabel[status] || status}</span></td>
      `;
      tbody.appendChild(tr);

      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.id = `detail-${rowId}`;
      detailTr.style.display = 'none';
      detailTr.innerHTML = `
        <td colspan="11">
          <div class="detail-box">
            <span><b>メール:</b> ${escapeHtml(p.email || a.email || '')}</span>
            <span><b>携帯:</b> ${escapeHtml(p.phone || a.emergency_phone || '')}</span>
          </div>
        </td>
      `;
      tbody.appendChild(detailTr);
    });

    table.style.display = 'table';

    tbody.querySelectorAll('.name-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = document.getElementById(`detail-${btn.getAttribute('data-detail')}`);
        if(row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
      });
    });

    tbody.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.getAttribute('data-id');
        const newStatus = btn.getAttribute('data-status');
        const statusMsg = document.getElementById('statusMsg');
        btn.disabled = true;
        try{
          const { error } = await sb
            .from('registrations')
            .update({ status: newStatus, decided_at: new Date().toISOString() })
            .eq('id', id);
          if(error) throw error;
          loadRegistrations(currentEventId);
        } catch(e){
          statusMsg.classList.add('err');
          statusMsg.textContent = '更新に失敗しました:' + (e.message || '');
          btn.disabled = false;
        }
      });
    });

    tbody.querySelectorAll('[data-open-modal]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const pid = btn.getAttribute('data-pid');
        const pname = btn.getAttribute('data-pname');
        const statusMsg = document.getElementById('statusMsg');
        if(!pid){
          statusMsg.classList.add('err');
          statusMsg.textContent = '参加者情報が見つかりませんでした。';
          return;
        }
        openPenaltyModal(pid, pname);
      });
    });
  }

  let modalCurrentPid = null;

  function openPenaltyModal(pid, pname){
    const target = currentRows.find(r => r.participants && r.participants.id === pid);
    const points = target?.participants?.penalty_points || 0;
    const notes = target?.participants?.penalty_notes || '';

    modalCurrentPid = pid;
    document.getElementById('modalName').textContent = `${pname} さん`;
    document.getElementById('modalPoints').textContent = `現在のペナルティポイント:${points}`;

    const historyBox = document.getElementById('modalHistory');
    if(notes.trim()){
      historyBox.textContent = notes;
      historyBox.classList.remove('empty');
    } else {
      historyBox.textContent = 'まだ記録はありません。';
      historyBox.classList.add('empty');
    }

    document.getElementById('modalTextarea').value = '';
    document.getElementById('modalIncrement').checked = true;
    document.getElementById('penaltyModal').classList.add('show');
  }

  function closePenaltyModal(){
    document.getElementById('penaltyModal').classList.remove('show');
    modalCurrentPid = null;
  }

  document.getElementById('modalCancel').addEventListener('click', closePenaltyModal);
  document.getElementById('penaltyModal').addEventListener('click', (e)=>{
    if(e.target.id === 'penaltyModal') closePenaltyModal();
  });

  document.getElementById('modalSave').addEventListener('click', async ()=>{
    const statusMsg = document.getElementById('statusMsg');
    const saveBtn = document.getElementById('modalSave');
    const text = document.getElementById('modalTextarea').value.trim();
    const doIncrement = document.getElementById('modalIncrement').checked;

    if(!text){
      alert('記録する内容を入力してください。');
      return;
    }
    if(!modalCurrentPid){
      statusMsg.classList.add('err');
      statusMsg.textContent = '参加者情報が見つかりませんでした。';
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = '保存中…';
    try{
      const target = currentRows.find(r => r.participants && r.participants.id === modalCurrentPid);
      const existingPoints = target?.participants?.penalty_points || 0;
      const existingNotes = target?.participants?.penalty_notes || '';
      const dateStr = new Date().toLocaleDateString('ja-JP');
      const newNotes = existingNotes ? `${existingNotes}\n[${dateStr}] ${text}` : `[${dateStr}] ${text}`;
      const newPoints = doIncrement ? existingPoints + 1 : existingPoints;

      const { error } = await sb
        .from('participants')
        .update({ penalty_points: newPoints, penalty_notes: newNotes })
        .eq('id', modalCurrentPid);
      if(error) throw error;

      closePenaltyModal();
      loadRegistrations(currentEventId);
    } catch(e){
      statusMsg.classList.add('err');
      statusMsg.textContent = '記録に失敗しました:' + (e.message || '');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '記録する';
    }
  });

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let currentEventId = null;

  async function init(){
    const statusMsg = document.getElementById('statusMsg');
    try{
      await waitForLib(10000);
      sb = getSb();
      await loadEvents();
      const sel = document.getElementById('eventSelect');
      if(events.length > 0){
        currentEventId = sel.value;
        await loadRegistrations(currentEventId);
      }
      sel.addEventListener('change', ()=>{
        currentEventId = sel.value;
        updatePrintTitle();
        loadRegistrations(currentEventId);
      });
      document.getElementById('refreshBtn').addEventListener('click', ()=>{
        if(currentEventId) loadRegistrations(currentEventId);
      });
      document.getElementById('statusFilter').addEventListener('change', ()=>{
        renderTable(currentRows);
      });
      document.getElementById('printBtn').addEventListener('click', ()=>{
        updatePrintTitle();
        window.print();
      });
      updatePrintTitle();
    } catch(e){
      statusMsg.classList.add('err');
      statusMsg.textContent = e.message || String(e);
    }
  }

  function updatePrintTitle(){
    const sel = document.getElementById('eventSelect');
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('printEventName').textContent = opt ? `申込者一覧:${opt.textContent}` : '申込者一覧';
  }

  init();
</script>
</body>
</html>
