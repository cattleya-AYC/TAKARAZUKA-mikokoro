<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>差し入れ・お手紙 申込一覧</title>
<style>
:root{
  --bg:#f5f4f1;--paper:#fffdf9;--ink:#3f3f3a;--muted:#847e76;
  --green-dark:#7d7568;--green-soft:#eeece7;--line:#e2ded6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1100px;margin:24px auto;padding:0 14px 40px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 38px rgba(63,74,58,.10);overflow:hidden}
header{padding:26px 22px 20px;background:linear-gradient(180deg,#fff,#f8fbf6);border-bottom:1px solid var(--line)}
header h1{margin:0 0 6px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:26px}
header p{margin:0;color:var(--muted);font-size:13.5px}
main{padding:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
select,input[type=text]{padding:10px 12px;border:1px solid #d7e2d1;border-radius:10px;font:inherit}
.event-select-wrap{position:relative;flex:1;min-width:220px}
.event-select-display{
  padding:10px 34px 10px 12px;border:1px solid #d7e2d1;border-radius:10px;background:#fff;
  font-size:14px;line-height:1.5;white-space:normal;word-break:break-word;min-height:20px;
}
.event-select-display::after{
  content:"▾";position:absolute;right:12px;top:10px;color:var(--muted);
}
.event-select-wrap select{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
}
.info-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.info-card{border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff;min-width:140px}
.info-card .label{font-size:12px;color:var(--muted)}
.info-card .value{font-size:22px;color:var(--green-dark)}
.jenne-summary{display:grid;gap:10px;margin-bottom:14px}
.jenne-summary-card{
  border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.jenne-summary-card .name{font-size:15px}
.jenne-summary-card .nums{font-size:13px;color:var(--muted)}
.jenne-summary-card .nums b{color:var(--green-dark);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:14px;overflow:hidden}
th,td{border-bottom:1px solid #eef3ec;padding:10px 9px;text-align:left}
th{background:#f5f9f2;color:#556b4c}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green-dark);font-size:12px}
.badge.none{background:#f3e8e2;color:#725b51}
.empty{color:var(--muted);padding:16px;text-align:center}
.section{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:16px;background:#fff}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;display:none}
.status.ok{display:block;background:var(--green-soft);color:var(--green-dark)}
.status.err{display:block;background:#fbe6e6;color:#a34848}
button{border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;background:#f3e8e2;color:#725b51}
.jenne-group{margin-bottom:22px}
.jenne-group-head{
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
  margin-bottom:8px;
}
.jenne-group-head .name{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:19px;color:var(--green-dark)}
.jenne-group-head .stats{font-size:13px;color:var(--muted)}
.jenne-group-head .stats b{color:var(--green-dark);font-size:15px}
.companion-row td{color:var(--muted)}
.companion-tag{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;border:2px solid var(--green-dark);
  color:var(--green-dark);font-weight:700;font-size:12px;margin-right:6px;flex-shrink:0;
}
.print-check-col{display:none;width:34px}
.print-check-box{
  display:inline-block;width:18px;height:18px;border:1.5px solid #999;border-radius:4px;vertical-align:middle;
}
@media print{
  body{background:#fff}
  .controls, .info-row, header p, #printBtn, #csvBtn{display:none !important}
  .panel{box-shadow:none;border:none}
  .print-check-col{display:table-cell !important}
  .no-print{display:none !important}
}
</style>
</head>

  <div class="panel">
    <header>
      <h1>差し入れ・お手紙 申込一覧</h1>

        <div class="info-card"><div class="label">協力人数（同伴者含む）</div><div class="value" id="peopleValue">-</div></div>

      <div class="section no-print" id="thanksSection">

        <p style="margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.7">
          担当者の方は、差し入れをお渡しした後、下の3枚の写真をアップロードしてください。アップロードすると、お礼メールの文面が自動で作られます。
        </p>

        <div style="display:grid;gap:12px;margin-bottom:12px">
          <div>
            <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">📄 購入時の領収書</label>
            <input type="file" id="photoReceipt" accept="image/*">
          </div>
          <div>
            <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">🎀 のしをお付けした差し入れのお写真</label>
            <input type="file" id="photoGift" accept="image/*">
          </div>
          <div>
            <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">🍬 お菓子の中身のお写真</label>
            <input type="file" id="photoCandy" accept="image/*">
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end">
          <button id="photoUploadBtn">写真をアップロードして文面を作成</button>
        </div>
        <div class="status" id="photoUploadStatus"></div>

        <div id="thanksPreviewWrap" style="display:none;margin-top:16px">
          <p style="font-size:13px;color:var(--muted);margin-bottom:6px">プレビュー（このままの内容でメールが届きます）</p>
          <div id="thanksPreview" style="border:1px solid var(--line);border-radius:12px;padding:14px;background:#fffefb;max-height:420px;overflow-y:auto"></div>
          <div style="margin-top:10px;display:flex;justify-content:flex-end">
            <button id="thanksSendBtn">この内容で御礼メールを送信</button>

      </div>
    </main>

  </div>
</div>

function showStatus(el, msg, isError){
  el.textContent = msg;
  el.className = "status " + (isError ? "err" : "ok");
}
let eventsData = [];

// 組ごとのテーマカラー
const TROUPE_THEMES = {
  "花": { bg:"#faf1f3", greenSoft:"#f6e3e7", greenDark:"#a8586a" },
  "月": { bg:"#faf6ec", greenSoft:"#f6ecd6", greenDark:"#9b783f" },
  "雪": { bg:"#f2f7f0", greenSoft:"#e9f2e4", greenDark:"#6f9159" },
  "星": { bg:"#eef4fa", greenSoft:"#dfeaf3", greenDark:"#4d7196" },
  "宙": { bg:"#f5f0f7", greenSoft:"#ece3f5", greenDark:"#6d5aa3" }
};
function applyTroupeTheme(troupe){
  const theme = TROUPE_THEMES[troupe];
  if(!theme) return;
  const root = document.documentElement.style;
  root.setProperty("--bg", theme.bg);
  root.setProperty("--green-soft", theme.greenSoft);
  root.setProperty("--green-dark", theme.greenDark);
}

function syncEventDisplay(){
  const sel = document.getElementById("eventSelect");
  const display = document.getElementById("eventSelectDisplay");
  const opt = sel.options[sel.selectedIndex];
  display.textContent = opt ? opt.textContent : "";
  const ev = eventsData.find(e=>e.id === sel.value);
  if(ev) applyTroupeTheme(ev.troupe);
}

async function loadEvents(){
  const sel = document.getElementById("eventSelect");
  const { data, error } = await supabase
    .from("events")
    .select("id, event_number, troupe, event_date, work_title")
    .order("event_date", { ascending:false })
    .limit(30);
  if(error || !data || data.length===0){
    sel.innerHTML = `<option value="">開催回が見つかりません</option>`;
    syncEventDisplay();
    return;
  }
  eventsData = data;
  sel.innerHTML = `<option value="">すべて</option>` + data.map(e=>{
    const troupeLabel = e.troupe ? `${e.troupe}組` : "";
    const workLabel = e.work_title ? `「${e.work_title}」` : "";
    const label = `第${e.event_number ?? "?"}回 ${troupeLabel}${workLabel}公演`;
    return `<option value="${e.id}">${label}</option>`;
  }).join("");

  // 今日から一番近い未来の回をデフォルトに(無ければ最新の過去回)
  const today = new Date().toISOString().slice(0,10);
  const upcoming = data.filter(e=>e.event_date >= today).sort((a,b)=>a.event_date.localeCompare(b.event_date));
  const defaultEvent = upcoming[0] || data[0];

  sel.value = defaultEvent.id;
  syncEventDisplay();
  await loadSubmissions(defaultEvent.id);
  await loadDutyStaff(defaultEvent.id);
}

document.getElementById("eventSelect").addEventListener("change", e=>{
  syncEventDisplay();
  loadSubmissions(e.target.value || null);
  loadDutyStaff(e.target.value || null);
});

async function loadDutyStaff(eventId){
  const el = document.getElementById("dutyStaffValue");
  const partnerEl = document.getElementById("dutyPartnerValue");
  if(!eventId){ el.textContent = "-"; partnerEl.textContent = "-"; return; }
  try{
    const { data, error } = await supabase
      .from("event_duty")
      .select("duty_staff, duty_partner")
      .eq("event_id", eventId)
      .maybeSingle();
    if(error) throw error;
    el.textContent = (data && data.duty_staff) ? data.duty_staff : "未設定";
    partnerEl.textContent = (data && data.duty_partner) ? data.duty_partner : "未設定";
  }catch(err){
    console.error(err);
    el.textContent = "-";
    partnerEl.textContent = "-";
  }
}

async function loadSubmissions(eventId){
  const body = document.getElementById("jenneGroups");
  body.innerHTML = `<div class="empty">読み込み中...</div>`;
  try{
    let query = supabase
      .from("gift_letter_submissions")
      .select("*, jennes(name, period)")
      .order("created_at", { ascending:false });
    if(eventId) query = query.eq("event_id", eventId);
    const { data, error } = await query;
    if(error) throw error;
    currentRows = data || [];
    render();
  }catch(err){
    console.error(err);
    body.innerHTML = `<div class="empty">読み込みエラー</div>`;
  }
}

function peopleCount(r){
  return 1 + (r.has_companion ? 1 : 0);
}

function render(){
  const container = document.getElementById("jenneGroups");
  const totalPeople = currentRows.reduce((sum,r)=>sum + peopleCount(r), 0);
  document.getElementById("countValue").textContent = currentRows.length + "件";
  document.getElementById("peopleValue").textContent = totalPeople + "名";
  document.getElementById("totalAmountValue").textContent = (totalPeople * 200).toLocaleString("ja-JP") + "円";

  if(currentRows.length===0){
    container.innerHTML = `<div class="empty">まだ申し込みがありません</div>`;
    return;
  }

  // 差し入れ先(ジェンヌ)ごとにグループ化
  const groups = {};
  const order = [];
  currentRows.forEach(r=>{
    const key = r.jennes ? r.jennes.name : "未設定";
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(r);
  });

  container.innerHTML = order.map(name=>{
    const rows = groups[name];
    const people = rows.reduce((sum,r)=>sum + peopleCount(r), 0);
    const rowsHtml = rows.map(r=>{
      const mainRow = `
      <tr>
        <td class="print-check-col"><span class="print-check-box"></span></td>
        <td>${r.period || ""}</td>
        <td>${r.name}</td>
        <td><span class="badge ${r.name_display==='不記載'?'none':''}">${r.name_display}</span></td>
      </tr>`;
      const companionRow = r.has_companion ? `
      <tr class="companion-row">
        <td class="print-check-col"><span class="print-check-box"></span></td>
        <td>${r.period || ""}</td>
        <td><span class="companion-tag">同</span>${r.companion_name || ""}</td>
        <td>${r.companion_name_display ? `<span class="badge ${r.companion_name_display==='不記載'?'none':''}">${r.companion_name_display}</span>` : ""}</td>
      </tr>` : "";
      return mainRow + companionRow;
    }).join("");

    return `
    <div class="jenne-group">
      <div class="jenne-group-head">
        <span class="name">差し入れ先：${name}さん</span>
        <span class="stats">人数：<b>${people}名</b>　合計金額：<b>${(people*200).toLocaleString("ja-JP")}円</b></span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th class="print-check-col"></th><th>回生</th><th>お名前</th><th>外装記名</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");
}

function formatEventDate(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

async function uploadReportPhoto(file){
  const ext = file.name.split(".").pop();
  const path = `gift-report/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const { error } = await supabase.storage.from("public photo").upload(path, file, { upsert:true });
  if(error) throw error;
  const { data } = supabase.storage.from("public photo").getPublicUrl(path);
  return data.publicUrl;
}

document.getElementById("photoUploadBtn").addEventListener("click", async ()=>{
  const statusEl = document.getElementById("photoUploadStatus");
  const btn = document.getElementById("photoUploadBtn");
  const sel = document.getElementById("eventSelect");
  const eventId = sel.value;

  const receiptFile = document.getElementById("photoReceipt").files?.[0];
  const giftFile = document.getElementById("photoGift").files?.[0];
  const candyFile = document.getElementById("photoCandy").files?.[0];

  if(!eventId){
    showStatus(statusEl, "対象の観劇会を選んでください。", true);
    return;
  }
  if(!receiptFile || !giftFile || !candyFile){
    showStatus(statusEl, "3枚とも写真を選んでください。", true);
    return;
  }

  btn.disabled = true;
  btn.textContent = "アップロード中…";
  try{
    const [receiptUrl, giftUrl, candyUrl] = await Promise.all([
      uploadReportPhoto(receiptFile),
      uploadReportPhoto(giftFile),
      uploadReportPhoto(candyFile)
    ]);

    const { error: upsertErr } = await supabase.from("event_gift_report").upsert({
      event_id: eventId,
      receipt_photo_url: receiptUrl,
      gift_photo_url: giftUrl,
      candy_photo_url: candyUrl,
      updated_at: new Date().toISOString()
    });
    if(upsertErr) throw upsertErr;

    const ev = eventsData.find(e=>e.id === eventId);
    const dateStr = formatEventDate(ev?.event_date);
    const workLabel = ev?.work_title ? `${ev.troupe||""}組「${ev.work_title}」` : `${ev?.troupe||""}組`;
    const jenneNamesArr = [...new Set(currentRows.map(r=>r.jennes?.name).filter(Boolean))];
    const jenneNames = jenneNamesArr.length ? jenneNamesArr.join("・") : "ジェンヌさん";

    generatedEmailHtml = buildThanksHtml({ dateStr, workLabel, jenneNames, receiptUrl, giftUrl, candyUrl });
    document.getElementById("thanksPreview").innerHTML = generatedEmailHtml;
    document.getElementById("thanksPreviewWrap").style.display = "block";
    showStatus(statusEl, "文面を作成しました。下のプレビューを確認して送信してください。", false);
  }catch(err){
    console.error(err);
    showStatus(statusEl, "アップロードに失敗しました：" + (err.message || err), true);
  }finally{
    btn.disabled = false;
    btn.textContent = "写真をアップロードして文面を作成";
  }
});

document.getElementById("thanksSendBtn").addEventListener("click", async ()=>{
  const statusEl = document.getElementById("thanksStatus");
  const btn = document.getElementById("thanksSendBtn");
  statusEl.className = "status"; statusEl.textContent = "";

  if(!generatedEmailHtml){
    statusEl.className = "status err";
    statusEl.textContent = "先に写真をアップロードして文面を作成してください。";
    return;
  }
  if(!ensureEmailjsInit()){
    statusEl.className = "status err";
    statusEl.textContent = "メール送信ライブラリの読み込みに失敗しました。時間をおいて再度お試しください。";
    return;
  }

  const recipients = [];
  const seen = new Set();
  currentRows.forEach(r=>{
    const email = (r.email || "").trim();
    if(email && !seen.has(email)){
      seen.add(email);
      recipients.push({ email, name: r.name || "ご協力者" });
    }
  });

  if(recipients.length === 0){
    statusEl.className = "status err";
    statusEl.textContent = "メールアドレスが登録されている協力者が見つかりませんでした。";
    return;
  }

  if(!confirm(`メールアドレス登録済みの協力者 ${recipients.length}名に御礼メールを送信します。よろしいですか？`)) return;

  btn.disabled = true;
  let successCount = 0;
  const failedNames = [];

  for(let i=0; i<recipients.length; i++){
    const r = recipients[i];
    statusEl.className = "status";
    statusEl.textContent = `送信中… (${i+1}/${recipients.length}) ${r.name}様`;
    try{
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_GENERIC_TEMPLATE_ID, {
        email: r.email,
        subject: "【小林タカラヅカ倶楽部】差し入れご協力ありがとうございました",
        message: generatedEmailHtml
      });
      successCount++;
    }catch(err){
      console.warn("送信失敗:", r.email, err);
      failedNames.push(r.name);
    }
  }

  statusEl.className = "status";
  if(failedNames.length === 0){
    statusEl.classList.add("ok");
    statusEl.textContent = `送信完了：${successCount}名に送信しました。`;
  } else {
    statusEl.classList.add("err");
    statusEl.textContent = `送信完了：${successCount}名成功／${failedNames.length}名失敗（${failedNames.join("、")}）`;
  }
  btn.disabled = false;
});

document.getElementById("csvBtn").addEventListener("click", ()=>{
  const rows = [["差し入れ先","お名前","回生","外装記名","同伴者","同伴者記名","送信日時"]];
  currentRows.forEach(r=>rows.push([
    r.jennes ? r.jennes.name : "",
    r.name, r.period||"", r.name_display,
    r.has_companion ? (r.companion_name||"") : "",
    r.has_companion ? (r.companion_name_display||"") : "",
    new Date(r.created_at).toLocaleString("ja-JP")
  ]));
  const csv = rows.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob = new Blob(["\ufeff"+csv], { type:"text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "差し入れ手紙申込一覧.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});
