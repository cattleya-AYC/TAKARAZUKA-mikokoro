<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>集合写真に文字を入れる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f1;--paper:#fffdf9;--ink:#3f3f3a;--muted:#847e76;
  --accent:#7d7568;--accent-soft:#eeece7;--line:#e2ded6;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
.wrap{max-width:640px;margin:0 auto;padding:0 0 60px}
header{padding:22px 18px 18px;background:linear-gradient(180deg,#fff,#fffaf5);border-bottom:1px solid var(--line)}
header h1{margin:0 0 6px;font-size:22px}
header p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
main{padding:16px}
.section{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;background:#fff}
.section h2{margin:0 0 12px;font-size:17px;color:var(--accent)}

.event-select-wrap{position:relative;margin-bottom:16px}
.event-select-display{
  padding:14px 40px 14px 16px;border:1px solid #d7cfc2;border-radius:14px;background:#fff;
  font-size:16px;font-weight:700;line-height:1.5;word-break:break-word;
}
.event-select-display::after{content:"▾";position:absolute;right:16px;top:16px;color:var(--muted);font-size:18px}
.event-select-wrap select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.photo-pick{
  display:block;width:100%;padding:22px 16px;border:2px dashed #d7cfc2;border-radius:14px;
  background:#fdfcfa;text-align:center;font-size:17px;font-weight:700;color:var(--accent);cursor:pointer;
}
.photo-pick input{display:none}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text]{
  width:100%;padding:12px 14px;border:1px solid #d7cfc2;border-radius:12px;font:inherit;font-size:16px;
}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{
  padding:11px 6px;border:1px solid #d7cfc2;border-radius:11px;background:#fff;font:inherit;font-size:14px;
  color:var(--ink);cursor:pointer;
}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input{flex:1;accent-color:var(--accent)}
.slider-row .val{width:44px;text-align:right;font-size:13px;color:var(--muted)}

.preview-box{text-align:center}
.preview-box img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto}
.preview-box .note{font-size:14px;color:var(--ink);margin:0 0 10px;line-height:1.7;background:var(--accent-soft);padding:10px 12px;border-radius:10px}
.empty{color:var(--muted);padding:26px 14px;text-align:center;font-size:14px;line-height:1.7}
.btn{
  width:100%;padding:16px;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:700;
  cursor:pointer;background:var(--accent);color:#fff;margin-top:12px;
}
.btn.sub{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.status{margin-top:10px;font-size:13px;color:#a34848;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📷 集合写真に文字を入れる</h1>
    <p>観劇会を選んで写真を選ぶと、公演名と日付が組カラーで入ります。できた画像は長押しで保存できます。</p>
  </header>

  <main>
    <div class="event-select-wrap">
      <div class="event-select-display" id="eventSelectDisplay">読み込み中...</div>
      <select id="eventSelect"><option value="">読み込み中...</option></select>
    </div>

    <div class="section">
      <h2>① 写真を選ぶ</h2>
      <label class="photo-pick" id="photoPickLabel">
        📁 集合写真を選ぶ
        <input type="file" id="photoInput" accept="image/*">
      </label>
    </div>

    <div class="section">
      <h2>② 仕上がりを確認・保存</h2>
      <div class="preview-box" id="previewBox">
        <div class="empty">写真を選ぶと、ここに仕上がりが表示されます。</div>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="section">
      <h2>③ 好みで調整</h2>

      <div class="field">
        <label>1行目(タイトル)</label>
        <input type="text" id="line1">
      </div>
      <div class="field">
        <label>2行目(日付・公演名)</label>
        <input type="text" id="line2">
      </div>

      <div class="field">
        <label>文字の位置</label>
        <div class="seg" data-key="position">
          <button type="button" data-v="bottom" class="on">写真の下</button>
          <button type="button" data-v="top">写真の上</button>
          <button type="button" data-v="overlay">写真に重ねる</button>
        </div>
      </div>
      <div class="field">
        <label>帯の色</label>
        <div class="seg two" data-key="tone">
          <button type="button" data-v="light" class="on">淡い色</button>
          <button type="button" data-v="dark">濃い色</button>
        </div>
      </div>
      <div class="field">
        <label>文字の大きさ</label>
        <div class="seg" data-key="size">
          <button type="button" data-v="0.85">小</button>
          <button type="button" data-v="1" class="on">中</button>
          <button type="button" data-v="1.18">大</button>
        </div>
      </div>
      <div class="field">
        <label>画像のサイズ</label>
        <div class="seg two" data-key="quality">
          <button type="button" data-v="web" class="on">HP用(軽い)</button>
          <button type="button" data-v="high">高画質(印刷用)</button>
        </div>
      </div>
      <div class="field">
        <label>写真の明るさ</label>
        <div class="slider-row">
          <input type="range" id="brightness" min="-40" max="40" step="5" value="0">
          <span class="val" id="brightnessVal">0</span>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>色の鮮やかさ</label>
        <div class="slider-row">
          <input type="range" id="saturation" min="-40" max="40" step="5" value="0">
          <span class="val" id="saturationVal">0</span>
        </div>
      </div>
    </div>
  </main>
</div>

<canvas id="canvas" style="display:none"></canvas>

<!-- 外部CDNへの依存をやめ、ライブラリ本体を同じサイトに置いて読み込みます -->
<script src="./supabase-js.min.js"></script>
<script>
const SUPABASE_URL = "https://uyhqnyrnhdjpgrceitgh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5aHFueXJuaGRqcGdyY2VpdGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTczNDMsImV4cCI6MjEwMzQ5MzM0M30.Bwezt6gWAyrQ89zN6Bw8TWOyzrulhNbgtO2a78BHjz8";

if(!window.supabase){
  document.getElementById("eventSelectDisplay").textContent = "読み込みエラー：ページを再読み込みしてください";
  throw new Error("supabase-js failed to load");
}
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 組ごとの色(page = 画面の色、band = 写真の帯の色)
const TROUPE_THEMES = {
  "花": { bg:"#faf1f3", soft:"#f6e3e7", accent:"#a8586a", bandLight:"#f9e9ee", textDark:"#8c5265", bandDark:"#8c5265" },
  "月": { bg:"#faf6ec", soft:"#f6ecd6", accent:"#9b783f", bandLight:"#f8f1df", textDark:"#7c631f", bandDark:"#7c631f" },
  "雪": { bg:"#f2f7f0", soft:"#e9f2e4", accent:"#6f9159", bandLight:"#e9f3ec", textDark:"#3f6b4f", bandDark:"#3f6b4f" },
  "星": { bg:"#eef4fa", soft:"#dfeaf3", accent:"#4d7196", bandLight:"#e8eff8", textDark:"#355a85", bandDark:"#355a85" },
  "宙": { bg:"#f5f0f7", soft:"#ece3f5", accent:"#6d5aa3", bandLight:"#f0e9f6", textDark:"#6a4a85", bandDark:"#6a4a85" }
};
const GOLD = "#c7a16b";
const WEEKDAY = ["日","月","火","水","木","金","土"];

let eventsData = [];
let currentEvent = null;
let photoImg = null;
const opts = { position:"bottom", tone:"light", size:1, quality:"web" };
// HP用：長辺1600px・目安500KB以下(WixのHPで重くならないサイズ)／高画質：長辺2400px
const QUALITY = {
  web:  { maxSide:1600, maxBytes:500 * 1024 },
  high: { maxSide:2400, maxBytes:Infinity }
};

function theme(){ return TROUPE_THEMES[currentEvent?.troupe] || TROUPE_THEMES["花"]; }

function applyPageTheme(){
  const t = theme();
  const root = document.documentElement.style;
  root.setProperty("--bg", t.bg);
  root.setProperty("--accent", t.accent);
  root.setProperty("--accent-soft", t.soft);
}

// 作品名:すでに『』で囲まれていればそのまま、そうでなければ『』で囲む
function workLabel(w){
  if(!w) return "";
  w = w.trim();
  if(w.includes("『") && w.endsWith("』")) return w;
  return `『${w}』`;
}

function defaultLines(ev){
  const d = new Date(ev.event_date + "T00:00:00");
  const dateStr = `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${WEEKDAY[d.getDay()]})`;
  const line1 = `第${ev.event_number ?? ""}回 ${ev.troupe || ""}組観劇会`;
  const line2 = `${dateStr}　${ev.troupe || ""}組公演${workLabel(ev.work_title)}`;
  return { line1, line2 };
}

function syncEventDisplay(){
  const sel = document.getElementById("eventSelect");
  const opt = sel.options[sel.selectedIndex];
  document.getElementById("eventSelectDisplay").textContent = opt ? opt.textContent : "";
}

async function loadEvents(){
  const sel = document.getElementById("eventSelect");
  const { data, error } = await supabase
    .from("events")
    .select("id, event_number, troupe, event_date, work_title")
    .order("event_date", { ascending:false })
    .limit(30);
  if(error || !data || data.length === 0){
    sel.innerHTML = `<option value="">開催回が見つかりません</option>`;
    syncEventDisplay();
    return;
  }
  eventsData = data;
  sel.innerHTML = data.map(e=>{
    const label = `第${e.event_number ?? "?"}回 ${e.troupe ? e.troupe + "組" : ""}(${e.event_date})`;
    return `<option value="${e.id}">${label}</option>`;
  }).join("");

  // 集合写真は当日〜後日に作るので、今日以前で一番新しい回をデフォルトに
  const today = new Date().toISOString().slice(0,10);
  const past = data.filter(e=>e.event_date <= today);
  setEvent((past[0] || data[data.length - 1]).id);
}

function setEvent(id){
  currentEvent = eventsData.find(e=>e.id === id) || null;
  document.getElementById("eventSelect").value = id;
  syncEventDisplay();
  applyPageTheme();
  if(currentEvent){
    const { line1, line2 } = defaultLines(currentEvent);
    document.getElementById("line1").value = line1;
    document.getElementById("line2").value = line2;
  }
  render();
}

document.getElementById("eventSelect").addEventListener("change", e=>setEvent(e.target.value));

// 写真の読み込み(大きすぎる写真は長辺2400pxに縮小して扱う)
document.getElementById("photoInput").addEventListener("change", e=>{
  const file = e.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      photoImg = img;
      document.getElementById("photoPickLabel").firstChild.textContent = "📁 別の写真を選び直す";
      render();
      document.getElementById("previewBox").scrollIntoView({ behavior:"smooth", block:"start" });
    };
    img.onerror = ()=>showError("写真を読み込めませんでした。別の写真でお試しください。");
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.querySelectorAll(".seg").forEach(seg=>{
  seg.addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b) return;
    seg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    const key = seg.dataset.key;
    opts[key] = key === "size" ? Number(b.dataset.v) : b.dataset.v;
    render();
  });
});
["line1","line2"].forEach(id=>document.getElementById(id).addEventListener("input", debounce(render, 300)));
["brightness","saturation"].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener("input", ()=>{ document.getElementById(id + "Val").textContent = el.value; });
  el.addEventListener("change", render);
});

function debounce(fn, ms){ let t; return ()=>{ clearTimeout(t); t = setTimeout(fn, ms); }; }
function showError(msg){ const s = document.getElementById("status"); s.textContent = msg; s.style.display = "block"; }

// 明るさ・鮮やかさの調整(Safariのcanvasはfilterが使えないため画素を直接計算)
function adjustPixels(ctx, x, y, w, h, brightness, saturation){
  if(brightness === 0 && saturation === 0) return;
  const img = ctx.getImageData(x, y, w, h);
  const d = img.data;
  const b = brightness * 2.2;
  const s = 1 + saturation / 100;
  for(let i = 0; i < d.length; i += 4){
    let r = d[i] + b, g = d[i+1] + b, bl = d[i+2] + b;
    const gray = 0.299*r + 0.587*g + 0.114*bl;
    r = gray + (r - gray) * s; g = gray + (g - gray) * s; bl = gray + (bl - gray) * s;
    d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
    d[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
    d[i+2] = bl < 0 ? 0 : bl > 255 ? 255 : bl;
  }
  ctx.putImageData(img, x, y);
}

// 幅に収まるよう文字サイズを自動で縮める
function fitFont(ctx, text, maxWidth, sizePx, weight, family){
  let size = sizePx;
  ctx.font = `${weight} ${size}px ${family}`;
  while(ctx.measureText(text).width > maxWidth && size > 8){
    size -= 1;
    ctx.font = `${weight} ${size}px ${family}`;
  }
  return size;
}

async function render(){
  const box = document.getElementById("previewBox");
  document.getElementById("status").style.display = "none";
  if(!photoImg || !currentEvent) return;

  try{ await document.fonts.load(`700 40px "Shippori Mincho"`); }catch(_){}

  const MAX = QUALITY[opts.quality].maxSide;
  const ratio = Math.min(1, MAX / Math.max(photoImg.width, photoImg.height));
  const pw = Math.round(photoImg.width * ratio);
  const ph = Math.round(photoImg.height * ratio);

  const t = theme();
  const dark = opts.tone === "dark";
  const overlay = opts.position === "overlay";
  const base = Math.min(pw, ph * 1.5);              // 縦長写真でも文字が大きくなりすぎないように
  const bandH = Math.round(base * 0.17 * opts.size);
  const canvasH = overlay ? ph : ph + bandH;
  const photoY = opts.position === "top" ? bandH : 0;
  const bandY = opts.position === "top" ? 0 : (overlay ? ph - bandH : ph);

  const canvas = document.getElementById("canvas");
  canvas.width = pw;
  canvas.height = canvasH;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, pw, canvasH);
  ctx.drawImage(photoImg, 0, photoY, pw, ph);
  adjustPixels(ctx, 0, photoY, pw, ph,
    Number(document.getElementById("brightness").value),
    Number(document.getElementById("saturation").value));

  // 帯
  if(overlay){
    const grad = ctx.createLinearGradient(0, bandY - bandH * 0.35, 0, ph);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.35, dark ? hexToRgba(t.bandDark, 0.72) : "rgba(255,255,255,0.0)");
    grad.addColorStop(1, dark ? hexToRgba(t.bandDark, 0.88) : "rgba(255,255,255,0.86)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, bandY - bandH * 0.35, pw, bandH * 1.35);
  } else {
    ctx.fillStyle = dark ? t.bandDark : t.bandLight;
    ctx.fillRect(0, bandY, pw, bandH);
    // 写真との境目に細い金のライン
    ctx.fillStyle = GOLD;
    const lineY = opts.position === "top" ? bandY + bandH - Math.max(2, bandH * 0.02) : bandY;
    ctx.fillRect(0, lineY, pw, Math.max(2, bandH * 0.02));
  }

  // 文字
  const mainColor = dark ? "#ffffff" : t.textDark;
  const subColor = dark ? "rgba(255,255,255,0.88)" : "#6f6266";
  const capColor = dark ? "rgba(255,255,255,0.75)" : "#a67c52";
  const serif = `"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif`;
  const maxW = pw * 0.9;
  const cx = pw / 2;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const capSize = fitFont(ctx, "OBAYASHI TAKARAZUKA CLUB", maxW, bandH * 0.1, 500, serif);
  const capText = "OBAYASHI TAKARAZUKA CLUB".split("").join(String.fromCharCode(8202));
  ctx.fillStyle = capColor;
  ctx.font = `500 ${capSize}px ${serif}`;
  ctx.fillText(capText, cx, bandY + bandH * 0.2);

  const line1 = document.getElementById("line1").value.trim();
  fitFont(ctx, line1, maxW, bandH * 0.3, 700, serif);
  ctx.fillStyle = mainColor;
  ctx.fillText(line1, cx, bandY + bandH * 0.47);

  // 区切りの小さな金線
  ctx.fillStyle = GOLD;
  const dashW = bandH * 0.35;
  ctx.fillRect(cx - dashW / 2, bandY + bandH * 0.655, dashW, Math.max(1, bandH * 0.01));

  const line2 = document.getElementById("line2").value.trim();
  fitFont(ctx, line2, maxW, bandH * 0.15, 500, serif);
  ctx.fillStyle = subColor;
  ctx.fillText(line2, cx, bandY + bandH * 0.8);

  // HP用は目安サイズに収まるまで画質を少しずつ下げる
  let q = opts.quality === "web" ? 0.85 : 0.92;
  let dataUrl = canvas.toDataURL("image/jpeg", q);
  while(dataUrlBytes(dataUrl) > QUALITY[opts.quality].maxBytes && q > 0.6){
    q -= 0.05;
    dataUrl = canvas.toDataURL("image/jpeg", q);
  }
  const kb = Math.round(dataUrlBytes(dataUrl) / 1024);
  const sizeText = kb >= 1024 ? `${(kb / 1024).toFixed(1)}MB` : `${kb}KB`;
  box.innerHTML = `
    <p class="note">👇 画像を長押しして「写真に保存」を選んでください<br><span style="font-size:12px;color:var(--muted)">${pw}×${canvasH}px・約${sizeText}</span></p>
    <img src="${dataUrl}" alt="集合写真">
    <button type="button" class="btn sub" id="openTabBtn">保存できないときは 新しいタブで開く</button>`;
  document.getElementById("openTabBtn").onclick = ()=>{
    const w = window.open();
    if(w) w.document.write(`<title>集合写真</title><body style="margin:0;background:#222"><img src="${dataUrl}" style="max-width:100%;display:block;margin:0 auto"></body>`);
  };
}

function dataUrlBytes(url){
  const b64 = url.slice(url.indexOf(",") + 1);
  return Math.floor(b64.length * 3 / 4);
}

function hexToRgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

loadEvents();
</script>
</body>
</html>
