<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>のし紙 印刷（担当者用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1eb;--paper:#fffdf9;--ink:#49362d;--muted:#8b776d;
  --rose:#d8888c;--rose-dark:#c96f73;--rose-soft:#f7e6e2;--gold:#c9a56b;--line:#ead9cf;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
.wrap{max-width:980px;margin:24px auto;padding:0 14px 60px}
.panel{background:var(--paper);border:1px solid #efe1d8;border-radius:24px;box-shadow:0 16px 42px rgba(77,51,38,.11);overflow:hidden}
header{padding:26px 22px 20px;background:linear-gradient(180deg,#fff,#fff9f6);border-bottom:1px solid var(--line)}
header h1{margin:0 0 6px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:26px}
header p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.7}
main{padding:18px}
.section{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;background:#fff}
.section h2{margin:0 0 6px;font-size:17px;color:#8c5d5f}
.section .sub{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.6}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
select,input[type=text],input[type=number],input[type=file]{
  width:100%;padding:10px 12px;border:1px solid #ddcabe;border-radius:10px;background:#fff;color:var(--ink);font:inherit;
}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > div{flex:1;min-width:120px}
button{border:0;border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer}
.secondary{background:#f3e8e2;color:#725b51}
.primary{background:linear-gradient(#e49a9d,#cc7477);color:#fff}
.bg-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.bg-thumb{
  border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:297/210;position:relative;background:#f6efe9;
}
.bg-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bg-thumb.selected{border-color:var(--rose-dark)}
.bg-thumb .del{
  position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;
  width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;
}
.status{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;display:none}
.status.ok{display:block;background:#f8eee9;color:#7a5648}
.status.err{display:block;background:#fbe6e6;color:#a34848}

.adjust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-bottom:12px}
.adjust-grid label{margin-bottom:2px}

.preview-outer{display:flex;justify-content:center;margin-top:6px}
.a4{
  position:relative;
  width:100%;
  max-width:420px;
  aspect-ratio:210/297;
  background:#eee;
  overflow:hidden;
  border-radius:6px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.a4 img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.name-overlay-wrap{
  position:absolute;
  left:0; right:0;
  display:flex;
  justify-content:center;
}
.name-overlay{
  position:absolute;
  writing-mode:vertical-rl;
  text-orientation:mixed;
  font-family:"Yuji Syuku",serif;
  color:#3a2a20;
  white-space:pre-line;
  letter-spacing:.08em;
}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}
#authGate{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#authGate .box{
  max-width:340px;width:100%;background:var(--paper);border:1px solid var(--rose);
  border-radius:18px;padding:28px 24px;box-shadow:0 16px 42px rgba(77,51,38,.11);
}
#authGate .title{text-align:center;margin-bottom:18px;font-family:"Yu Mincho",serif;font-size:18px;color:var(--rose-dark)}
#authGate label{display:block;margin-bottom:14px}
#authGate .lbl{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
#authGate input{width:100%;padding:11px 13px;border:1px solid #ddcabe;border-radius:10px;background:#fff;font-size:15px;font-family:inherit}
#authGate button{width:100%;padding:13px;border:0;border-radius:12px;margin-top:6px;background:linear-gradient(#e49a9d,#cc7477);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#authGate .err{text-align:center;font-size:12.5px;color:#a34848;margin-top:12px;display:none}
#logoutBtn{
  position:fixed;top:10px;right:10px;z-index:1000;padding:6px 12px;border:1px solid var(--rose-dark);
  border-radius:20px;background:#fff;color:var(--rose-dark);font-size:11px;font-weight:700;cursor:pointer;display:none;
}

.a4.size-b5{max-width:337px;aspect-ratio:176/250}
.a4.landscape{aspect-ratio:297/210;max-width:560px}
.a4.landscape.size-b5{aspect-ratio:250/176;max-width:450px}

@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{
    position:fixed; inset:0; margin:0; padding:0; box-shadow:none; border-radius:0;
    width:210mm; height:297mm;
  }
  #printArea.size-b5{ width:176mm; height:250mm; }
  #printArea.landscape{ width:297mm; height:210mm; }
  #printArea.landscape.size-b5{ width:250mm; height:176mm; }
}
</style>
<style id="printPageSize">@page{ size:A4; margin:0; }</style>

</head>
<body>
<div class="wrap">
  <div class="panel">
    <header>
      <h1>のし紙 印刷（担当者用）</h1>
      <p>観劇会と背景を選んで、ご自宅のプリンターでA4またはB5で印刷してください。背景の位置がずれる場合は④で調整できます。</p>
    </header>

    <main>
      <div class="section">
        <h2>① 対象の観劇会</h2>
        <select id="eventSelect"><option value="">読み込み中...</option></select>
        <div class="status" id="loadStatus"></div>
      </div>

      <div class="section">
        <h2>② 背景を選ぶ</h2>
        <div class="bg-gallery" id="bgGallery"><div class="empty">読み込み中...</div></div>
      </div>

      <div class="section">
        <h2>③ 用紙サイズ・位置を選んで印刷</h2>
        <p class="sub">背景を選ぶと、まりさんが設定した位置が自動で入りますが、必要ならここで微調整できます（この調整は保存されず、印刷のたびにリセットされます）。</p>
        <div class="field" style="margin-bottom:12px">
          <label>用紙サイズ</label>
          <div class="row" style="gap:8px">
            <label style="flex:1;display:block">
              <input type="radio" name="paperSize" value="A4" checked style="width:auto;margin-right:6px">A4
            </label>
            <label style="flex:1;display:block">
              <input type="radio" name="paperSize" value="B5" style="width:auto;margin-right:6px">B5
            </label>
          </div>
        </div>
        <div class="adjust-grid">
          <div>
            <label>上からの位置（%）</label>
            <input type="number" id="posTop" value="55" min="0" max="90">
          </div>
          <div>
            <label>文字サイズ（px）</label>
            <input type="number" id="fontSize" value="8" min="4" max="48">
          </div>
          <div>
            <label>名前欄の高さ（%）<br><span style="font-weight:400;color:var(--muted);font-size:11px">1列に入る人数の目安。狭いと列（横）が増えます</span></label>
            <input type="number" id="posHeight" value="48" min="10" max="95">
          </div>
        </div>
        <p class="sub" style="margin-top:-4px">左右は自動で中央寄せされます。</p>

        <div class="preview-outer">
          <div class="a4 landscape" id="printArea">
            <img class="bg" id="previewBg" src="" alt="">
            <div class="name-overlay-wrap" id="nameOverlayWrap">
              <div class="name-overlay" id="nameOverlay"></div>
            </div>
          </div>
        </div>

        <div class="row" style="margin-top:14px;justify-content:flex-end">
          <button class="secondary" type="button" id="refreshNamesBtn" style="flex:0 0 auto">名前を再読み込み</button>
          <button class="primary" type="button" id="printBtn" style="flex:0 0 auto">この内容で印刷する</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 外部CDNへの依存をやめ、ライブラリ本体を同じサイトに置いて読み込みます -->
<script src="./supabase-js.min.js"></script>
<script>
const SUPABASE_URL = "https://uyhqnyrnhdjpgrceitgh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5aHFueXJuaGRqcGdyY2VpdGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTczNDMsImV4cCI6MjEwMzQ5MzM0M30.Bwezt6gWAyrQ89zN6Bw8TWOyzrulhNbgtO2a78BHjz8";

if(!window.supabase){
  document.getElementById("loadStatus").className = "status err";
  document.getElementById("loadStatus").textContent = "supabase-js.min.js の読み込みに失敗しました。";
  throw new Error("supabase-js failed to load");
}
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentEventId = null;
let selectedBgUrl = null;
let backgrounds = [];

function showStatus(el, msg, isError){
  el.textContent = msg;
  el.className = "status " + (isError ? "err" : "ok");
}

async function loadEvents(){
  const sel = document.getElementById("eventSelect");
  const { data, error } = await supabase
    .from("events")
    .select("id, event_number, troupe, event_date, work_title")
    .order("event_date", { ascending:false })
    .limit(30);
  if(error || !data || data.length===0){
    sel.innerHTML = `<option value="">開催回が見つかりません</option>`;
    return;
  }
  sel.innerHTML = data.map(e=>{
    const troupeLabel = e.troupe ? `${e.troupe}組` : "";
    const workLabel = e.work_title ? `「${e.work_title}」` : "";
    const label = `第${e.event_number ?? "?"}回 ${troupeLabel}${workLabel}公演`;
    return `<option value="${e.id}">${label}</option>`;
  }).join("");

  // 今日から一番近い未来の回をデフォルトに(無ければ最新の過去回)
  const today = new Date().toISOString().slice(0,10);
  const upcoming = data.filter(e=>e.event_date >= today).sort((a,b)=>a.event_date.localeCompare(b.event_date));
  const defaultEvent = upcoming[0] || data[0];

  currentEventId = defaultEvent.id;
  sel.value = currentEventId;
  await loadNames();
}

document.getElementById("eventSelect").addEventListener("change", async e=>{
  currentEventId = e.target.value || null;
  await loadNames();
});

async function loadBackgrounds(){
  const gallery = document.getElementById("bgGallery");
  try{
    const { data, error } = await supabase
      .from("nashi_backgrounds")
      .select("id, name, image_url, overlay_top, overlay_right, overlay_height, overlay_font_size")
      .order("created_at", { ascending:true });
    if(error) throw error;
    backgrounds = data || [];
    renderGallery();
  }catch(err){
    console.error(err);
    gallery.innerHTML = `<div class="empty">読み込みエラー</div>`;
  }
}

function renderGallery(){
  const gallery = document.getElementById("bgGallery");
  if(backgrounds.length===0){
    gallery.innerHTML = `<div class="empty">まだ背景が登録されていません。まりさんに登録を依頼してください。</div>`;
    return;
  }
  gallery.innerHTML = backgrounds.map(b=>`
    <div class="bg-thumb ${b.image_url===selectedBgUrl?'selected':''}" data-url="${b.image_url}" data-id="${b.id}">
      <img src="${b.image_url}" alt="${b.name||''}">
    </div>
  `).join("");
  gallery.querySelectorAll(".bg-thumb").forEach(el=>{
    el.addEventListener("click", ()=>{
      selectedBgUrl = el.dataset.url;
      document.getElementById("previewBg").src = selectedBgUrl;
      const b = backgrounds.find(x=>x.image_url===selectedBgUrl);
      document.getElementById("posTop").value = b?.overlay_top ?? 55;
      document.getElementById("posHeight").value = b?.overlay_height ?? 48;
      document.getElementById("fontSize").value = b?.overlay_font_size ?? 8;
      applyOverlayPosition();
      renderGallery();
    });
  });
}

async function loadNames(){
  const statusEl = document.getElementById("loadStatus");
  const overlay = document.getElementById("nameOverlay");
  if(!currentEventId){
    overlay.textContent = "";
    return;
  }
  try{
    const { data, error } = await supabase
      .from("gift_letter_submissions")
      .select("name, name_display, has_companion, companion_name, companion_name_display")
      .eq("event_id", currentEventId);
    if(error) throw error;

    const names = [];
    (data || []).forEach(r=>{
      if(r.name_display === "記載") names.push(r.name);
      if(r.has_companion && r.companion_name_display === "記載" && r.companion_name){
        names.push(r.companion_name);
      }
    });

    overlay.textContent = names.join("\n");
    if(names.length===0){
      showStatus(statusEl, "「記載」を選んだ協力者がまだいません。", true);
    } else {
      showStatus(statusEl, `${names.length}名分のお名前を読み込みました。`, false);
    }
  }catch(err){
    console.error(err);
    showStatus(statusEl, "名前の読み込みに失敗しました：" + (err.message || err), true);
  }
}

document.getElementById("refreshNamesBtn").addEventListener("click", loadNames);

function applyOverlayPosition(){
  const wrap = document.getElementById("nameOverlayWrap");
  const overlay = document.getElementById("nameOverlay");
  wrap.style.top = document.getElementById("posTop").value + "%";
  wrap.style.height = document.getElementById("posHeight").value + "%";
  overlay.style.fontSize = document.getElementById("fontSize").value + "px";
}
["posTop","posHeight","fontSize"].forEach(id=>{
  document.getElementById(id).addEventListener("input", applyOverlayPosition);
});

function applyPaperSize(){
  const size = document.querySelector('input[name="paperSize"]:checked').value;
  const isLandscape = true; // のしは常に横長で使うため固定
  const printArea = document.getElementById("printArea");
  printArea.classList.toggle("size-b5", size === "B5");
  printArea.classList.toggle("landscape", isLandscape);

  let w, h;
  if(size === "B5"){ w = "176mm"; h = "250mm"; } else { w = "210mm"; h = "297mm"; }
  if(isLandscape){ const t = w; w = h; h = t; }
  document.getElementById("printPageSize").textContent = `@page{ size:${w} ${h}; margin:0; }`;
}
document.querySelectorAll('input[name="paperSize"]').forEach(r=>{
  r.addEventListener("change", applyPaperSize);
});

document.getElementById("printBtn").addEventListener("click", ()=>{
  if(!selectedBgUrl){
    alert("②で背景画像を選んでください。");
    return;
  }
  applyPaperSize();
  window.print();
});

async function startApp(){
  applyOverlayPosition();
  applyPaperSize();
  await loadEvents();
  await loadBackgrounds();
}

startApp();
</script>
</body>
</html>
