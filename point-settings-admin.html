<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポイントルール(管理者用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#efeaf2; --navy-card:#fffdf9; --navy-card-2:#f4eef7; --gold:#9a86c9;
    --gold-soft:#6d5aa3; --cream:#332c47; --rose:#a5544a; --line:rgba(154,134,201,0.35);
    --muted:#8b84a0; --ok:#4f8f66;
  }
  *{box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    margin:0; overflow-x:hidden; max-width:100vw;
    background:radial-gradient(ellipse at top, rgba(255,255,255,0.7) 0%, transparent 65%), var(--navy-deep);
    color:var(--cream); font-family:'Noto Sans JP', sans-serif; padding:0 0 60px;
  }
  .hero{ text-align:center; padding:30px 20px 14px; }
  .eyebrow{ font-family:'Shippori Mincho', serif; font-size:14px; letter-spacing:.16em; color:var(--gold-soft); font-weight:700; }
  h1{ font-family:'Shippori Mincho', serif; font-size:20px; margin:8px 0 0; letter-spacing:.03em; }
  .sub{ font-size:12.5px; color:var(--muted); margin-top:6px; }
  .divider{ display:flex; align-items:center; justify-content:center; gap:10px; max-width:160px; margin:10px auto 0; opacity:.85; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider .gem{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); border:1px solid var(--gold-soft); flex-shrink:0; }

  .card-wrap{ max-width:560px; margin:20px auto 0; padding:0 16px; }
  .card{
    background:var(--navy-card); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:16px;
  }
  .card h2{
    font-family:'Shippori Mincho', serif; font-size:15.5px; margin:0 0 4px; color:var(--gold-soft);
  }
  .card .card-desc{ font-size:11.5px; color:var(--muted); margin:0 0 12px; }

  .rule-row{
    display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .rule-row:last-child{ border-bottom:none; }
  .rule-row .rule-label{ flex:1; min-width:0; }
  .rule-row .rule-label input[type=text]{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
    background:var(--navy-card-2); color:var(--cream); font-size:13px; font-family:inherit; box-sizing:border-box;
  }
  .rule-row .rule-points{ width:74px; flex-shrink:0; }
  .rule-row .rule-points input{
    width:100%; padding:8px 6px; border:1px solid var(--line); border-radius:7px;
    background:var(--navy-card-2); color:var(--cream); font-size:13px; font-family:inherit; text-align:center; box-sizing:border-box;
  }
  .rule-row input:focus{ outline:none; border-color:var(--gold); }
  .rule-row .lock{ width:22px; text-align:center; color:var(--muted); font-size:14px; flex-shrink:0; }
  .rule-row .del-btn{
    width:28px; height:28px; flex-shrink:0; border:1px solid var(--line); border-radius:7px;
    background:var(--navy-card); color:var(--rose); font-size:14px; cursor:pointer; line-height:1;
  }
  .rule-row .del-spacer{ width:28px; flex-shrink:0; }

  .add-row-btn{
    width:100%; margin-top:10px; padding:10px; border:1px dashed var(--gold-soft); border-radius:8px;
    background:none; color:var(--gold-soft); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }

  .save-btn{
    width:100%; padding:13px; border:1px solid var(--gold-soft); border-radius:8px;
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-soft) 100%);
    color:#fffaf3; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit;
  }
  .save-btn:disabled{ opacity:.6; cursor:default; }

  .meta{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:10px; }
  .status{ text-align:center; font-size:12.5px; margin-top:12px; display:none; }
  .status.ok{ color:var(--ok); display:block; }
  .status.err{ color:var(--rose); display:block; }
  .view-link{ display:block; text-align:center; font-size:12.5px; color:var(--gold-soft); margin-top:6px; }

  #authGate{
    position:fixed; inset:0; background:var(--navy-deep); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:2000;
  }
  #authGate .box{ background:var(--navy-card); border:1px solid var(--line); border-radius:14px; padding:28px 22px; max-width:340px; width:100%; }
  #authGate .title{ font-family:'Shippori Mincho', serif; font-size:17px; margin:0 0 18px; text-align:center; color:var(--gold-soft); font-weight:700; }
  #authGate label{ display:block; margin-bottom:14px; }
  #authGate .lbl{ font-size:13px; color:var(--gold-soft); font-weight:700; display:block; margin-bottom:6px; }
  #authGate input{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px;
    background:var(--navy-card-2); color:var(--cream); font-size:15px; font-family:inherit; box-sizing:border-box;
  }
  #authGate button{
    width:100%; padding:13px; border:1px solid var(--gold-soft); border-radius:8px;
    background:linear-gradient(180deg, var(--gold) 0%, var(--gold-soft) 100%);
    color:#fffaf3; font-weight:700; font-size:15px; cursor:pointer; font-family:inherit;
  }
  #authGate .err{ text-align:center; font-size:12.5px; color:var(--rose); margin-top:12px; display:none; }
</style>
</head>
<body>

<div id="authGate">
  <form class="box" id="loginForm">
    <div class="title">管理者ログイン</div>
    <label>
      <span class="lbl">メールアドレス</span>
      <input type="email" id="loginEmail" required autocomplete="username">
    </label>
    <label>
      <span class="lbl">パスワード</span>
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </label>
    <button type="submit" id="loginBtn">ログイン</button>
    <p class="err" id="loginError"></p>
  </form>
</div>

<button id="logoutBtn" type="button" style="position:fixed;top:10px;right:10px;z-index:1000;padding:6px 12px;border:1px solid var(--gold-soft);border-radius:20px;background:var(--navy-card);color:var(--gold-soft);font-size:11px;font-weight:700;cursor:pointer;display:none;">ログアウト</button>

<div class="hero">
  <div class="eyebrow">管理者用</div>
  <h1>ポイントルール設定</h1>
  <div class="divider"><span class="gem"></span></div>
  <p class="sub">項目の点数を変更したり、ルールを自由に追加・削除できます</p>
</div>

<div class="card-wrap">
  <div class="card">
    <h2>固定項目(自動計算に使用)</h2>
    <p class="card-desc">この4つは一覧のスコア計算に直接使われるため、削除できません。点数のみ変更できます。</p>
    <div id="systemRules"></div>
  </div>

  <div class="card">
    <h2>その他のルール(自由に追加・削除できます)</h2>
    <p class="card-desc">スタッフ用ページに一覧表示されるだけの参考ルールです。自動計算には使われません。「都度判断」のような文字も入力できます。</p>
    <div id="customRules"></div>
    <button class="add-row-btn" id="addRuleBtn">＋ ルールを追加</button>
  </div>

  <button class="save-btn" id="saveBtn">この内容で保存する</button>
  <p class="status" id="statusMsg"></p>
  <p class="meta" id="metaInfo"></p>
  <a class="view-link" href="point-settings-view.html">→ スタッフ用の閲覧ページはこちら</a>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://uyhqnyrnhdjpgrceitgh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5aHFueXJuaGRqcGdyY2VpdGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTczNDMsImV4cCI6MjEwMzQ5MzM0M30.Bwezt6gWAyrQ89zN6Bw8TWOyzrulhNbgtO2a78BHjz8";

  let sb = null;
  let rules = [];       // Supabaseから取得した現在の行
  let deletedIds = [];  // 保存時に削除するID

  function getSb(){
    if(!window.supabase) throw new Error('supabase-jsの読み込みに失敗しました');
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  function waitForLib(timeoutMs){
    return new Promise((resolve, reject)=>{
      const start = Date.now();
      (function check(){
        if(window.supabase) return resolve();
        if(Date.now() - start > timeoutMs) return reject(new Error('ライブラリの読み込みがタイムアウトしました'));
        setTimeout(check, 100);
      })();
    });
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderRules(){
    const sysBox = document.getElementById('systemRules');
    const customBox = document.getElementById('customRules');
    const sysRules = rules.filter(r => r.is_system).sort((a,b)=>a.sort_order-b.sort_order);
    const customRulesArr = rules.filter(r => !r.is_system).sort((a,b)=>a.sort_order-b.sort_order);

    sysBox.innerHTML = sysRules.map(r => `
      <div class="rule-row" data-id="${r._localId}">
        <span class="lock" title="削除できません">🔒</span>
        <div class="rule-label">${escapeHtml(r.label)}</div>
        <div class="rule-points"><input type="number" step="1" value="${r.points ?? ''}" data-field="points"></div>
        <div class="del-spacer"></div>
      </div>
    `).join('');

    customBox.innerHTML = customRulesArr.length === 0
      ? '<p style="font-size:12.5px;color:var(--muted);margin:4px 0;">まだ追加ルールはありません。</p>'
      : customRulesArr.map(r => `
      <div class="rule-row" data-id="${r._localId}">
        <div class="rule-label"><input type="text" value="${escapeHtml(r.label)}" data-field="label" placeholder="ルール名"></div>
        <div class="rule-points"><input type="text" value="${escapeHtml(r.points_label ?? r.points ?? '')}" data-field="points_label" placeholder="点数 or 文言"></div>
        <button type="button" class="del-btn" data-del="${r._localId}">✕</button>
      </div>
    `).join('');

    // 固定項目の点数変更
    sysBox.querySelectorAll('input[data-field=points]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const id = e.target.closest('.rule-row').dataset.id;
        const rule = rules.find(r => r._localId === id);
        if(rule) rule.points = e.target.value === '' ? null : parseInt(e.target.value, 10);
      });
    });

    // 追加ルールの編集
    customBox.querySelectorAll('input[data-field=label]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const id = e.target.closest('.rule-row').dataset.id;
        const rule = rules.find(r => r._localId === id);
        if(rule) rule.label = e.target.value;
      });
    });
    customBox.querySelectorAll('input[data-field=points_label]').forEach(inp=>{
      inp.addEventListener('input', (e)=>{
        const id = e.target.closest('.rule-row').dataset.id;
        const rule = rules.find(r => r._localId === id);
        if(!rule) return;
        const v = e.target.value.trim();
        if(v !== '' && /^-?\d+$/.test(v)){
          rule.points = parseInt(v, 10);
          rule.points_label = null;
        } else {
          rule.points = null;
          rule.points_label = v;
        }
      });
    });

    // 追加ルールの削除
    customBox.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        const id = e.target.dataset.del;
        const rule = rules.find(r => r._localId === id);
        if(rule && rule.id) deletedIds.push(rule.id);
        rules = rules.filter(r => r._localId !== id);
        renderRules();
      });
    });
  }

  document.getElementById('addRuleBtn').addEventListener('click', ()=>{
    const maxSort = rules.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
    rules.push({
      id: null,
      _localId: 'new-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      rule_key: null,
      label: '',
      points: null,
      points_label: '',
      is_system: false,
      sort_order: maxSort + 10
    });
    renderRules();
  });

  async function loadRules(){
    const statusMsg = document.getElementById('statusMsg');
    try{
      const { data, error } = await sb.from('point_rules').select('*').order('sort_order', { ascending: true });
      if(error) throw error;
      deletedIds = [];
      rules = (data || []).map(r => ({ ...r, _localId: r.id }));
      renderRules();

      const latest = (data || []).reduce((max, r) => {
        if(!r.updated_at) return max;
        return (!max || new Date(r.updated_at) > new Date(max.updated_at)) ? r : max;
      }, null);
      document.getElementById('metaInfo').textContent = latest
        ? `最終更新:${new Date(latest.updated_at).toLocaleString('ja-JP')}${latest.updated_by ? '(' + latest.updated_by + ')' : ''}`
        : '';
    }catch(e){
      statusMsg.classList.add('err');
      statusMsg.textContent = '読み込みに失敗しました:' + (e.message || '');
    }
  }

  async function startApp(){
    await loadRules();
  }

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const statusMsg = document.getElementById('statusMsg');
    const btn = document.getElementById('saveBtn');
    statusMsg.className = 'status';
    statusMsg.textContent = '';

    // バリデーション:固定項目は数値必須、追加ルールはラベル必須
    for(const r of rules){
      if(r.is_system && (r.points === null || Number.isNaN(r.points))){
        statusMsg.classList.add('err');
        statusMsg.textContent = `「${r.label}」に数値を入力してください。`;
        return;
      }
      if(!r.is_system && !r.label.trim()){
        statusMsg.classList.add('err');
        statusMsg.textContent = 'ルール名が空の項目があります。';
        return;
      }
    }

    btn.disabled = true;
    btn.textContent = '保存中…';
    try{
      const { data: { user } } = await sb.auth.getUser();
      const nowIso = new Date().toISOString();
      const email = user?.email || null;

      if(deletedIds.length > 0){
        const { error: delErr } = await sb.from('point_rules').delete().in('id', deletedIds);
        if(delErr) throw delErr;
      }

      for(const r of rules){
        const payload = {
          rule_key: r.rule_key,
          label: r.label,
          points: r.points,
          points_label: r.points_label,
          is_system: r.is_system,
          sort_order: r.sort_order,
          updated_at: nowIso,
          updated_by: email
        };
        if(r.id){
          const { error } = await sb.from('point_rules').update(payload).eq('id', r.id);
          if(error) throw error;
        } else {
          const { error } = await sb.from('point_rules').insert(payload);
          if(error) throw error;
        }
      }

      statusMsg.classList.add('ok');
      statusMsg.textContent = '保存しました。';
      await loadRules();
    }catch(e){
      statusMsg.classList.add('err');
      statusMsg.textContent = '保存に失敗しました:' + (e.message || '');
    }finally{
      btn.disabled = false;
      btn.textContent = 'この内容で保存する';
    }
  });

  async function init(){
    const statusMsg = document.getElementById('statusMsg');
    try{
      await waitForLib(10000);
      sb = getSb();
      const { data: { session } } = await sb.auth.getSession();
      if(session){
        document.getElementById('authGate').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        await startApp();
      } else {
        document.getElementById('authGate').style.display = 'flex';
      }
    } catch(e){
      statusMsg.classList.add('err');
      statusMsg.textContent = e.message || String(e);
    }
  }

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'ログインしています…';
    try{
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      await startApp();
    }catch(err){
      errEl.textContent = 'ログインに失敗しました。メールアドレスとパスワードをご確認ください。';
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false; btn.textContent = 'ログイン';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await sb.auth.signOut();
    location.reload();
  });

  init();
</script>
</body>
</html>
