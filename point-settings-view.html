<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポイントルール(スタッフ用)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#efeaf2; --navy-card:#fffdf9; --navy-card-2:#f4eef7; --gold:#9a86c9;
    --gold-soft:#6d5aa3; --cream:#332c47; --rose:#a5544a; --line:rgba(154,134,201,0.35);
    --muted:#8b84a0; --ok:#4f8f66;
  }
  *{box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    margin:0; overflow-x:hidden; max-width:100vw;
    background:radial-gradient(ellipse at top, rgba(255,255,255,0.7) 0%, transparent 65%), var(--navy-deep);
    color:var(--cream); font-family:'Noto Sans JP', sans-serif; padding:0 0 60px;
  }
  .hero{ text-align:center; padding:30px 20px 14px; }
  .eyebrow{ font-family:'Shippori Mincho', serif; font-size:14px; letter-spacing:.16em; color:var(--gold-soft); font-weight:700; }
  h1{ font-family:'Shippori Mincho', serif; font-size:20px; margin:8px 0 0; letter-spacing:.03em; }
  .sub{ font-size:12.5px; color:var(--muted); margin-top:6px; }
  .divider{ display:flex; align-items:center; justify-content:center; gap:10px; max-width:160px; margin:10px auto 0; opacity:.85; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
  .divider .gem{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); border:1px solid var(--gold-soft); flex-shrink:0; }

  .card-wrap{ max-width:520px; margin:20px auto 0; padding:0 16px; }
  .card{
    background:var(--navy-card); border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; margin-bottom:16px;
  }
  .card h2{
    font-family:'Shippori Mincho', serif; font-size:15.5px; margin:0 0 14px; color:var(--gold-soft);
    border-bottom:1px solid var(--line); padding-bottom:8px;
  }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th, td{ text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); }
  th{ color:var(--gold-soft); font-weight:700; font-size:12.5px; }
  tr:last-child td{ border-bottom:none; }
  td.num{ text-align:right; font-weight:700; font-family:'Shippori Mincho', serif; white-space:nowrap; }
  .formula{
    background:var(--navy-card-2); border:1px solid var(--line); border-radius:10px;
    padding:14px; font-size:13px; text-align:center; margin-top:4px; line-height:1.7;
  }
  .note{ font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.6; }
  .meta{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:6px; }
  .status{ text-align:center; font-size:12.5px; margin-top:12px; }
  .status.err{ color:var(--rose); }
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">スタッフ用</div>
  <h1>ポイントルール</h1>
  <div class="divider"><span class="gem"></span></div>
  <p class="sub">現在の設定を表示しています(閲覧のみ)</p>
</div>

<div class="card-wrap">
  <div class="card">
    <h2>自動加点</h2>
    <table id="systemTable"><tbody></tbody></table>
    <div class="formula" id="formulaText">読み込み中…</div>
  </div>

  <div class="card">
    <h2>その他のルール(手動記録)</h2>
    <table id="customTable"><tbody></tbody></table>
    <p class="note">
      これらは自動ではなく、名前をタップして理由メモとともに手動で記録します。数値は目安で、事情がある場合はその場で調整されます。
    </p>
  </div>

  <p class="status" id="statusMsg"></p>
  <p class="meta" id="metaInfo"></p>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://uyhqnyrnhdjpgrceitgh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5aHFueXJuaGRqcGdyY2VpdGdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTczNDMsImV4cCI6MjEwMzQ5MzM0M30.Bwezt6gWAyrQ89zN6Bw8TWOyzrulhNbgtO2a78BHjz8";

  function waitForLib(timeoutMs){
    return new Promise((resolve, reject)=>{
      const start = Date.now();
      (function check(){
        if(window.supabase) return resolve();
        if(Date.now() - start > timeoutMs) return reject(new Error('ライブラリの読み込みがタイムアウトしました'));
        setTimeout(check, 100);
      })();
    });
  }
  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function displayValue(r){
    if(r.points_label) return escapeHtml(r.points_label);
    if(r.points === null || r.points === undefined) return '-';
    return r.points > 0 ? `+${r.points}` : `${r.points}`;
  }

  async function init(){
    const statusMsg = document.getElementById('statusMsg');
    try{
      await waitForLib(10000);
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data, error } = await sb.from('point_rules').select('*').order('sort_order', { ascending: true });
      if(error) throw error;

      const rows = data || [];
      const sysRows = rows.filter(r => r.is_system);
      const customRows = rows.filter(r => !r.is_system);

      document.querySelector('#systemTable tbody').innerHTML = sysRows.map(r => `
        <tr><td>${escapeHtml(r.label)}</td><td class="num">${displayValue(r)}</td></tr>
      `).join('') || '<tr><td colspan="2">項目がありません</td></tr>';

      document.querySelector('#customTable tbody').innerHTML = customRows.length > 0
        ? customRows.map(r => `<tr><td>${escapeHtml(r.label)}</td><td class="num">${displayValue(r)}</td></tr>`).join('')
        : '<tr><td colspan="2">まだありません</td></tr>';

      const theater = rows.find(r => r.rule_key === 'theater_point');
      const meal = rows.find(r => r.rule_key === 'meal_point');
      document.getElementById('formulaText').textContent =
        `スコア = 直近7回の観劇申込×${theater ? theater.points : '?'} + 食事申込×${meal ? meal.points : '?'} − ペナルティ調整値`;

      const latest = rows.reduce((max, r) => {
        if(!r.updated_at) return max;
        return (!max || new Date(r.updated_at) > new Date(max.updated_at)) ? r : max;
      }, null);
      document.getElementById('metaInfo').textContent = latest
        ? `最終更新:${new Date(latest.updated_at).toLocaleString('ja-JP')}`
        : '';
    }catch(e){
      statusMsg.classList.add('err');
      statusMsg.textContent = '読み込みに失敗しました:' + (e.message || '');
    }
  }

  init();
</script>
</body>
</html>
