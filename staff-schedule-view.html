<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>当日スケジュール</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#efeaf2; --card:#fffdf9; --card2:#f4eef7; --gold:#9a86c9; --gold-soft:#6d5aa3;
    --cream:#332c47; --rose:#a5544a; --line:rgba(154,134,201,0.35); --muted:#8b84a0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Noto Sans JP',sans-serif;padding:0 0 60px;}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}
  h1{font-family:'Shippori Mincho',serif;text-align:center;font-size:20px;padding:24px 16px 4px;margin:0;letter-spacing:.05em;}
  .sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 18px;}
  select{
    width:100%;background:var(--card);border:1px solid var(--gold);color:var(--cream);
    border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:20px;
  }
  .timeline{position:relative;padding-left:0;}
  .item{
    background:var(--card);border:1px solid var(--gold);border-radius:12px;
    padding:14px 16px;margin-bottom:12px;
  }
  .item.group{border-color:var(--muted);}
  .time{
    font-family:'Shippori Mincho',serif;font-weight:700;color:var(--gold-soft);
    font-size:14px;margin-bottom:4px;letter-spacing:.03em;
  }
  .task{font-weight:700;font-size:15.5px;margin-bottom:6px;color:var(--cream);}
  .staff-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
  .staff-tag{
    background:var(--rose);color:#fff;font-size:12.5px;font-weight:700;
    border-radius:12px;padding:3px 12px;
  }
  .staff-tag.group{background:var(--muted);}
  .note{font-size:12px;color:var(--muted);line-height:1.7;white-space:pre-line;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
  .loading{
    text-align:center;font-family:'Shippori Mincho',serif;font-weight:700;
    color:var(--rose);font-size:24px;padding:60px 10px;letter-spacing:.05em;
    animation:blinkLoading 0.9s ease-in-out infinite;
  }
  @keyframes blinkLoading{
    0%,100%{opacity:1;}
    50%{opacity:.2;}
  }

  /* --- 時系列テーブル表示 --- */
  .time-block{display:flex;gap:10px;margin-bottom:2px;}
  .time-col{
    flex:0 0 58px;text-align:right;padding-top:12px;
    font-family:'Shippori Mincho',serif;font-weight:700;color:var(--gold-soft);font-size:13.5px;
  }
  .content-col{
    flex:1;min-width:0;border-left:2px solid var(--line);padding:0 0 16px 14px;
  }
  .task-row{
    background:var(--card);border:1px solid var(--gold);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;
  }
  .task-row:last-child{margin-bottom:0;}
  .task-row.group{border-color:var(--muted);}
  .task-row .task{margin-bottom:6px;}
  .time-block.gather .time-col{color:var(--rose);}
  .time-block.gather .task-row{background:var(--card2);border-color:var(--rose);}
  .duty-banner{
    background:var(--rose);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:18px;
    text-align:center;box-shadow:0 4px 10px rgba(165,84,74,.25);
  }
  .duty-banner .label{font-size:12.5px;opacity:.9;margin-bottom:4px;}
  .duty-banner .name{font-family:'Shippori Mincho',serif;font-size:30px;font-weight:800;letter-spacing:.06em;}
  .duty-banner .note{font-size:13px;margin-top:8px;color:#fff;font-weight:700;}
  .time-block.untimed .time-col{color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌸 当日スケジュール 🌸</h1>
  <p class="sub">その日の仕事分担です。時間になったら動いてください。</p>
  <select id="eventSelect"></select>
  <div id="timeline" class="timeline"><p class="loading">📡 読み込み中‼️</p></div>

  <h1 style="font-size:17px;margin-top:30px;">🎒 持ち物リスト</h1>
  <div id="belongings" class="timeline"><p class="loading">📡 読み込み中‼️</p></div>
</div>

<script>
  const SUPABASE_URL = 'https://uyhqnyrnhdjpgrceitgh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ChLAh-7Y10km0WzbAZfE7A_dnWkJkow';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function init(){
    const { data, error } = await sb
      .from('events')
      .select('id, event_number, troupe, event_date, show_time')
      .order('event_date', { ascending: false });
    if(error || !data || !data.length){
      document.getElementById('timeline').innerHTML = '<p class="empty">観劇会情報が見つかりませんでした。</p>';
      return;
    }
    const sel = document.getElementById('eventSelect');
    data.forEach(ev=>{
      const opt = document.createElement('option');
      opt.value = ev.id;
      opt.dataset.showTime = ev.show_time || '';
      opt.textContent = `第${ev.event_number||'?'}回 ${ev.troupe||''}組 ${ev.event_date||''} (${ev.show_time||'?'}公演)`;
      sel.appendChild(opt);
    });
    // デフォルト:今日から一番近い未来の回。無ければ直近の過去回。
    const today = new Date().toISOString().slice(0,10);
    const upcoming = data.filter(ev=>ev.event_date >= today).sort((a,b)=>a.event_date.localeCompare(b.event_date));
    sel.value = upcoming.length ? upcoming[0].id : data[0].id;
    sel.addEventListener('change', ()=>{
      const showTime = sel.options[sel.selectedIndex].dataset.showTime;
      loadSchedule(sel.value, showTime);
      loadBelongings(sel.value);
    });
    const initialShowTime = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].dataset.showTime : '';
    await loadSchedule(sel.value, initialShowTime);
    await loadBelongings(sel.value);
  }

  const STAFF_ORDER = ['原田','水無瀬','西中','伊庭','岩本','太田'];
  // お菓子担当のローテーション順(jenne-gift-form.htmlと共通)
  const ROTATION_ORDER = ['水無瀬','伊庭','原田','西中','岩本','太田'];

  async function loadBelongings(eventId){
    const area = document.getElementById('belongings');
    area.innerHTML = '<p class="loading">📡 読み込み中‼️</p>';
    const { data, error } = await sb
      .from('event_belongings')
      .select('*')
      .eq('event_id', eventId)
      .order('sort_order', { ascending: true });
    if(error){
      area.innerHTML = '<p class="empty">読み込みに失敗しました。</p>';
      return;
    }
    if(!data.length){
      area.innerHTML = '<p class="empty">持ち物リストはまだ公開されていません。</p>';
      return;
    }
    // 名前ごとに持ち物をまとめる
    const byPerson = {};
    STAFF_ORDER.forEach(n=>byPerson[n]=[]);
    const everyoneItems = [];
    data.forEach(row=>{
      const names = row.assigned_staff || [];
      if(!names.length){
        everyoneItems.push(row.item_name);
      } else {
        names.forEach(n=>{
          if(!byPerson[n]) byPerson[n] = [];
          byPerson[n].push(row.item_name);
        });
      }
    });
    let html = '';
    if(everyoneItems.length){
      html += `<div class="item"><div class="task">全員</div><div class="note">${everyoneItems.map(escapeHtml).join('、')}</div></div>`;
    }
    STAFF_ORDER.forEach(name=>{
      if(byPerson[name] && byPerson[name].length){
        html += `<div class="item"><div class="task">${escapeHtml(name)}</div><div class="note">${byPerson[name].map(escapeHtml).join('、')}</div></div>`;
      }
    });
    area.innerHTML = html || '<p class="empty">持ち物リストはまだ公開されていません。</p>';
  }

  // 時刻ラベルから並び替え用の「分」を取り出す(例:「12:35に移動」→755分)。取れなければnull。
  function parseTimeMinutes(label){
    if(!label) return null;
    const m = String(label).match(/(\d{1,2}):(\d{2})/);
    if(!m) return null;
    return parseInt(m[1],10)*60 + parseInt(m[2],10);
  }

  // {{食事あり人数}}などのタグを、実際の人数に置き換える
  let mealCounts = null;
  const MEAL_TAG_MAP = {
    '{{食事あり人数}}': ()=>mealCounts.withMeal,
    '{{食事なし人数}}': ()=>mealCounts.withoutMeal,
    '{{食事あり2人}}': ()=>mealCounts.withMeal2,
    '{{食事あり1人}}': ()=>mealCounts.withMeal1,
    '{{食事なし2人}}': ()=>mealCounts.withoutMeal2,
    '{{食事なし1人}}': ()=>mealCounts.withoutMeal1
  };
  function applyMealTags(text){
    if(!text || !mealCounts) return text;
    let result = text;
    Object.keys(MEAL_TAG_MAP).forEach(tag=>{
      if(result.includes(tag)) result = result.split(tag).join(MEAL_TAG_MAP[tag]());
    });
    return result;
  }

  async function refreshMealCounts(eventId){
    const { data, error } = await sb
      .from('registrations')
      .select('wants_meal, answers')
      .eq('event_id', eventId)
      .eq('status', '参加決定');
    if(error || !data){
      mealCounts = { withMeal:'?', withoutMeal:'?', withMeal1:'?', withMeal2:'?', withoutMeal1:'?', withoutMeal2:'?' };
      return;
    }
    const pc = r => (r.answers && r.answers.participant_count) ? String(r.answers.participant_count) : '1';
    const withMealRows = data.filter(r=>r.wants_meal);
    const withoutMealRows = data.filter(r=>!r.wants_meal);
    mealCounts = {
      withMeal: withMealRows.length,
      withoutMeal: withoutMealRows.length,
      withMeal1: withMealRows.filter(r=>pc(r)==='1').length,
      withMeal2: withMealRows.filter(r=>pc(r)==='2').length,
      withoutMeal1: withoutMealRows.filter(r=>pc(r)==='1').length,
      withoutMeal2: withoutMealRows.filter(r=>pc(r)==='2').length
    };
  }

  function renderTaskRow(row){
    const isGroup = !row.assigned_staff || row.assigned_staff.length === 0;
    const tags = isGroup
      ? `<span class="staff-tag group">手の空いている人全員</span>`
      : row.assigned_staff.map(n=>`<span class="staff-tag">${escapeHtml(n)}</span>`).join('');
    const noteText = row.note ? applyMealTags(row.note) : '';
    return `
      <div class="task-row ${isGroup?'group':''}">
        <div class="task">${escapeHtml(row.task_name)}</div>
        <div class="staff-tags">${tags}</div>
        ${noteText ? `<div class="note">${escapeHtml(noteText)}</div>` : ''}
      </div>
    `;
  }

  async function loadSchedule(eventId, showTime){
    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '<p class="loading">📡 読み込み中‼️</p>';
    const { data, error } = await sb
      .from('event_staff_assignments')
      .select('*')
      .eq('event_id', eventId)
      .order('sort_order', { ascending: true });
    const { data: dutyData } = await sb
      .from('event_duty')
      .select('duty_staff, duty_partner')
      .eq('event_id', eventId)
      .maybeSingle();
    await refreshMealCounts(eventId);
    if(error){
      timeline.innerHTML = '<p class="empty">読み込みに失敗しました。時間をおいて再読み込みしてください。</p>';
      return;
    }
    if(!data.length){
      timeline.innerHTML = '<p class="empty">この回のスケジュールはまだ公開されていません。</p>';
      return;
    }

    // 時刻が取れる行と取れない行に分け、取れる行は時刻順に並べる
    const timed = [];
    const untimed = [];
    data.forEach(row=>{
      const mins = parseTimeMinutes(row.time_label);
      if(mins === null) untimed.push(row);
      else timed.push(Object.assign({}, row, { _mins: mins }));
    });
    timed.sort((a,b)=> a._mins - b._mins || a.sort_order - b.sort_order);

    // 同じ時刻表記の行はひとつの時刻ブロックにまとめる
    const groups = [];
    timed.forEach(row=>{
      const last = groups[groups.length-1];
      if(last && last.time_label === row.time_label){
        last.rows.push(row);
      } else {
        groups.push({ time_label: row.time_label, rows: [row] });
      }
    });

    let html = '';

    // お菓子担当(前日までに購入が必要なので一番目立つ位置に表示)
    if(dutyData && dutyData.duty_staff){
      const idx = ROTATION_ORDER.indexOf(dutyData.duty_staff);
      const nextStaff = idx >= 0 ? ROTATION_ORDER[(idx + 1) % ROTATION_ORDER.length] : '';
      html += `
        <div class="duty-banner">
          <div class="label">🍬 お菓子担当(前日までに購入)</div>
          <div class="name">${escapeHtml(dutyData.duty_staff)}さん</div>
          ${nextStaff ? `<div class="note">次回は${escapeHtml(nextStaff)}さんの番です</div>` : ''}
        </div>
      `;
    }

    // 集合時間(13時公演は11:15、11時公演は10:15)を先頭に表示
    if(showTime){
      const gatherTime = showTime === '11:00' ? '10:15' : '11:15';
      html += `
        <div class="time-block gather">
          <div class="time-col">${escapeHtml(gatherTime)}</div>
          <div class="content-col"><div class="task-row"><div class="task">🚩 集合</div></div></div>
        </div>
      `;
    }

    groups.forEach(g=>{
      html += `
        <div class="time-block">
          <div class="time-col">${escapeHtml(g.time_label)}</div>
          <div class="content-col">${g.rows.map(renderTaskRow).join('')}</div>
        </div>
      `;
    });

    if(untimed.length){
      html += `
        <div class="time-block untimed">
          <div class="time-col">随時</div>
          <div class="content-col">${untimed.map(renderTaskRow).join('')}</div>
        </div>
      `;
    }

    timeline.innerHTML = html;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  init();
</script>
</body>
</html>
