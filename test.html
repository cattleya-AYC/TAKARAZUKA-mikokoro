<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSテスト</title>
</head>
<body style="font-family:sans-serif; font-size:24px; padding:40px; text-align:center;">
  <p id="result">ここが変わらなければJSが動いていません</p>
  <script>
    document.getElementById('result').textContent = '✅ JavaScriptは正常に動いています!';
    document.getElementById('result').style.color = 'green';
  </script>
</body>
</html>
